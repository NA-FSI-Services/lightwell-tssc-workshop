# Apply once in your learner lab namespace before PipelineRuns / builds.
# Module 5 Ex3 — Gitea-first; do not use GitHub remotes.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-edit
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-system-image-builder
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: spring-boot-lw-poc
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  lookupPolicy:
    local: true
---
# Binary Docker build — pipeline starts with: oc start-build --from-dir=<workspace>
# Dockerfile is the multi-stage PoC (Maven Central inside image build).
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: spring-boot-lw-poc
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  source:
    type: Binary
  output:
    to:
      kind: ImageStreamTag
      name: spring-boot-lw-poc:latest
