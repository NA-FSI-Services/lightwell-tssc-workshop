{{- if and .Values.gitea.enabled .Values.gitopsAppSet.enabled }}
{{- $giteaUrl := include "gitea.url" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.gitopsAppSet.name }}
  namespace: {{ .Values.gitopsAppSet.argocdNamespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitops-applicationset
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.applicationset | quote }}
spec:
  generators:
    - list:
        elements:
{{- range .Values.students }}
          - username: {{ .username | quote }}
{{- end }}
  template:
    metadata:
      name: '{{ .Values.gitopsAppSet.appNamePrefix }}-{{`{{username}}`}}'
      namespace: {{ .Values.gitopsAppSet.argocdNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        {{- include "gitea.labels" . | nindent 8 }}
        lightwell.workshop/student: '{{`{{username}}`}}'
    spec:
      project: {{ .Values.gitopsAppSet.project | quote }}
      source:
        repoURL: '{{ $giteaUrl }}/{{`{{username}}`}}/{{ .Values.seed.gitops.repoName }}.git'
        targetRevision: {{ .Values.seed.defaultBranch | quote }}
        path: .
        helm:
          values: |
            springBootLwPoc:
              enabled: true
              namespace: {{ .Values.gitopsAppSet.namespacePrefix }}-{{`{{username}}`}}
              name: spring-boot-lw-poc
            labDocs:
              enabled: false
            userInfo:
              enabled: false
            deployer:
              domain: {{ .Values.deployer.domain | quote }}
              apiUrl: {{ .Values.deployer.apiUrl | quote }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .Values.gitopsAppSet.namespacePrefix }}-{{`{{username}}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
{{- end }}
