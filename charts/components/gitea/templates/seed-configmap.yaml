{{- if and .Values.gitea.enabled .Values.seed.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.seed.configMapName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.seed | quote }}
data:
  seed-student-repos.sh: |
{{ .Files.Get "files/seed/seed-student-repos.sh" | indent 4 }}
  learner-seed-from-templates.sh: |
{{ .Files.Get "files/seed/learner-seed-from-templates.sh" | indent 4 }}
  learner-seed-python-from-templates.sh: |
{{ .Files.Get "files/seed/learner-seed-python-from-templates.sh" | indent 4 }}
  learner-ensure-gitea-user.sh: |
{{ .Files.Get "files/seed/learner-ensure-gitea-user.sh" | indent 4 }}
  assemble-repo.sh: |
{{ .Files.Get "files/seed/assemble-repo.sh" | indent 4 }}
  assemble-gitops-repo.sh: |
{{ .Files.Get "files/seed/assemble-gitops-repo.sh" | indent 4 }}
  assemble-skeleton.sh: |
{{ .Files.Get "files/seed/assemble-skeleton.sh" | indent 4 }}
  # Embedded fallback only (SOURCE_MODE=embedded) — live mode isolates spring-boot-lw-poc/app
  repo-README.md: |
{{ .Files.Get "files/seed/repo/README.md" | indent 4 }}
  repo-pom.xml: |
{{ .Files.Get "files/seed/repo/pom.xml" | indent 4 }}
  repo-gitignore: |
{{ .Files.Get "files/seed/repo/.gitignore" | indent 4 }}
  # Lab overlay merged onto isolated app root (students never see monorepo)
  overlay-README.md: |
{{ .Files.Get "files/seed/overlay/README.md" | indent 4 }}
  overlay-tekton-pipeline.yaml: |
{{ .Files.Get "files/seed/overlay/tekton/pipeline.yaml" | indent 4 }}
  overlay-tekton-pipelinerun.yaml: |
{{ .Files.Get "files/seed/overlay/tekton/pipelinerun.yaml" | indent 4 }}
  overlay-tekton-rbac.yaml: |
{{ .Files.Get "files/seed/overlay/tekton/rbac.yaml" | indent 4 }}
  # GitOps chart overlay (Module 5 Ex4 / #100) — no ./app in that remote
  overlay-gitops-README.md: |
{{ .Files.Get "files/seed/overlay-gitops/README.md" | indent 4 }}
  overlay-gitops-PROMOTE.md: |
{{ .Files.Get "files/seed/overlay-gitops/PROMOTE.md" | indent 4 }}
  # Python track (#147) — FastAPI app + gitops overlays
  overlay-python-README.md: |
{{ .Files.Get "files/seed/overlay-python/README.md" | indent 4 }}
  overlay-python-tekton-pipeline.yaml: |
{{ .Files.Get "files/seed/overlay-python/tekton/pipeline.yaml" | indent 4 }}
  overlay-python-tekton-pipelinerun.yaml: |
{{ .Files.Get "files/seed/overlay-python/tekton/pipelinerun.yaml" | indent 4 }}
  overlay-python-gitops-README.md: |
{{ .Files.Get "files/seed/overlay-python-gitops/README.md" | indent 4 }}
  overlay-python-gitops-PROMOTE.md: |
{{ .Files.Get "files/seed/overlay-python-gitops/PROMOTE.md" | indent 4 }}
{{- end }}
