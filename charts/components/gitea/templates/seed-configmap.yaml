{{- if and .Values.gitea.enabled .Values.seed.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.seed.configMapName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.seed | quote }}
data:
  seed-student-repos.sh: |
{{ .Files.Get "files/seed/seed-student-repos.sh" | indent 4 }}
  assemble-repo.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    ROOT="${1:-/seed/repo}"
    mkdir -p "${ROOT}"
    cp /seed/repo-README.md "${ROOT}/README.md"
    cp /seed/repo-pom.xml "${ROOT}/pom.xml"
    cp /seed/repo-gitignore "${ROOT}/.gitignore"
  repo-README.md: |
{{ .Files.Get "files/seed/repo/README.md" | indent 4 }}
  repo-pom.xml: |
{{ .Files.Get "files/seed/repo/pom.xml" | indent 4 }}
  repo-gitignore: |
{{ .Files.Get "files/seed/repo/.gitignore" | indent 4 }}
{{- end }}
