{{- if .Values.gitea.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gitea.admin.secretName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.config | quote }}
type: Opaque
stringData:
  username: {{ .Values.gitea.admin.username | quote }}
  password: {{ .Values.gitea.admin.password | quote }}
  email: {{ .Values.gitea.admin.email | quote }}
{{- end }}
