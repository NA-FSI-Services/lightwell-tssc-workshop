{{- if and .Values.rhdh.enabled .Values.giteaIntegration.enabled }}
---
# Scaffolder credentials for publish:gitea (Module 3). Defaults align with
# charts/components/gitea admin — override via values / RHDP secrets in shared envs.
# Never commit real tokens; workshop defaults are claim-local only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.giteaIntegration.secretName }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhdh.syncWaves.config | quote }}
type: Opaque
stringData:
  # Keys must match env names expected by app-config (${GITEA_USERNAME} / ${GITEA_PASSWORD})
  # because Backstage v1alpha5 injects Secret keys as env var names via extraEnvs.secrets.
  GITEA_USERNAME: {{ .Values.giteaIntegration.username | quote }}
  GITEA_PASSWORD: {{ .Values.giteaIntegration.password | quote }}
{{- end }}
