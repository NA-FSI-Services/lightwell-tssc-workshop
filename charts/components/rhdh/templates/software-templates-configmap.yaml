{{- if and .Values.rhdh.enabled .Values.softwareTemplates.enabled }}
---
# Catalog entities mounted into the Backstage pod (file locations in app-config).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.softwareTemplates.configMapName }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhdh.syncWaves.config | quote }}
data:
  lightwell-java-service.yaml: |
{{ .Files.Get "files/catalog/lightwell-java-service.yaml" | indent 4 }}
{{- end }}
