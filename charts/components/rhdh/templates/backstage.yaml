{{- if .Values.rhdh.enabled }}
---
# Backstage CR — RHDH Operator instance for the Lightwell workshop.
# Reuse source: RHADS / RHDH Operator install pattern (rhdh.redhat.com).
apiVersion: {{ .Values.rhdh.apiVersion }}
kind: Backstage
metadata:
  name: {{ .Values.rhdh.name }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhdh.syncWaves.instance | quote }}
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    {{- if .Values.softwareTemplates.enabled }}
    extraFiles:
      mountPath: {{ .Values.softwareTemplates.mountPath | quote }}
      configMaps:
        - name: {{ .Values.softwareTemplates.configMapName }}
          # Directory mount → /opt/app-root/src/catalog/<key>
          mountPath: {{ printf "%s/catalog" .Values.softwareTemplates.mountPath | quote }}
    {{- end }}
    {{- if .Values.giteaIntegration.enabled }}
    extraEnvs:
      envs:
        - name: GITEA_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.giteaIntegration.secretName }}
              key: username
        - name: GITEA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.giteaIntegration.secretName }}
              key: password
    {{- end }}

    {{- if .Values.dynamicPlugins.enabled }}
    dynamicPluginsConfigMapName: {{ .Values.dynamicPlugins.configMapName }}
    {{- end }}
    replicas: {{ .Values.rhdh.replicas }}
    route:
      enabled: {{ .Values.rhdh.route.enabled }}
  database:
    enableLocalDb: {{ .Values.rhdh.database.enableLocalDb }}
{{- end }}
