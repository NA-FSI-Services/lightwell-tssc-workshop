# Apply once per learner lab namespace before PipelineRuns.
# ImageStream + Binary BuildConfig + pipeline SA (no buildah / no SCC stretch).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-edit
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-system-image-builder
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-system-image-puller
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: pipeline
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  source:
    type: Binary
  output:
    to:
      kind: ImageStreamTag
      name: ${{ values.name }}:latest
