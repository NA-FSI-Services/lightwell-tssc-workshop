# Example PipelineRun — copy params for your namespace / image registry.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ${{ values.name }}-build-sign-
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  pipelineRef:
    name: ${{ values.name }}-build-sign
  params:
    - name: repo-url
      value: https://github.com/${{ values.repoOwner }}/${{ values.repoName }}.git
    - name: revision
      value: main
    - name: image-url
      value: image-registry.openshift-image-registry.svc:5000/${{ values.name }}/${{ values.name }}:latest
    # Prefer lightwell-remediated-pins so dep-gate + .rhlw-* align (Module 5 Ex3).
    - name: maven-profile
      value: lightwell-remediated-pins
    # Fill from: oc -n trusted-artifact-signer get route
    - name: cosign-fulcio-url
      value: https://fulcio-server-trusted-artifact-signer.apps.<domain>
    - name: cosign-rekor-url
      value: https://rekor-server-trusted-artifact-signer.apps.<domain>
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: maven-settings
      emptyDir: {}
    - name: sbom
      emptyDir: {}
  taskRunTemplate:
    serviceAccountName: pipeline
    # Provide LW_USERNAME / LW_PASSWORD / LIGHTWELL_NEXUS_URL via a Secret
    # referenced from the maven Task (do not commit credentials).
    # RHACS CI: Secret rhacs-ci-secrets in stackrox (rox-api-endpoint / rox-api-token).
