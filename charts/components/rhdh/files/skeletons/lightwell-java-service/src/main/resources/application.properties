spring.application.name=${{ values.name }}
server.port=8080
management.endpoints.web.exposure.include=health,info
# Overridden at runtime via Deployment env (validated | remediated).
# Literal default only — a self-referential Spring placeholder here breaks mvn test.
lightwell.stream=validated
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
