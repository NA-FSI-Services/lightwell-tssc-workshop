# Red Hat Trusted Profile Analyzer — Lightwell TSSC workshop
# Patterns adapted from RHADS / Trusted Software Factory TPA installs.
# Root App-of-Apps injects rhtpa.* and deployer.* (see charts/root-app).

rhtpa:
  # Chart-level gate (root-app Application only exists when components.rhtpa.enabled)
  enabled: true
  namespace: trusted-profile-analyzer
  # TrustedProfileAnalyzer CR name
  name: trustedprofileanalyzer
  apiVersion: rhtpa.io/v1
  syncWaves:
    namespace: "0"
    operator: "1"
    database: "2"
    secrets: "2"
    instance: "3"
    oidcWait: "4"
    userinfo: "5"

# OLM install — RHTPA Operator is namespace-scoped (RHADS pattern)
operator:
  enabled: true
  name: rhtpa-operator
  packageName: rhtpa-operator
  # Install into the instance namespace (not openshift-operators)
  namespace: "" # empty → use rhtpa.namespace
  # OpenShift catalog uses stable-v3 (and stable-v1.1); bare "stable" fails resolution
  channel: stable-v3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  createOperatorGroup: true

# Workshop PostgreSQL (graph DB). Override credentials via values / RHDP secrets.
postgresql:
  enabled: true
  name: tpa-pgsql
  secretName: tpa-pgsql-user
  image: registry.redhat.io/rhel9/postgresql-16:latest
  database: tpa
  username: tpa
  # Workshop-only default — replace in RHDP / real clusters
  password: "workshop-tpa-pgsql-changeme"
  port: "5432"
  pvcSize: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# OIDC — Keycloak / RHBK required for UI and CLI auth (document; enable when SSO exists)
oidc:
  # When empty, derived as https://sso.<deployer.domain>/realms/<realm>
  issuerURL: ""
  realm: tpa
  frontendClientId: frontend
  cliClientId: cli
  # Workshop-only default — inject via RHDP secret in real orders
  cliClientSecret: "workshop-tpa-cli-changeme"
  cliSecretName: tpa-realm-cli-clients

# After TrustedProfileAnalyzer exists, wait for Keycloak OIDC then roll server if needed.
oidcWait:
  enabled: true
  jobName: rhtpa-oidc-wait
  serviceAccountName: rhtpa-oidc-wait
  serverDeployment: server
  image: registry.access.redhat.com/ubi9/ubi:latest
  imagePullPolicy: IfNotPresent
  waitSeconds: "900"
  rolloutTimeout: "600s"
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400

# TrustedProfileAnalyzer instance
trustedProfileAnalyzer:
  storage:
    # filesystem = PVC-backed PoC storage (RHADS enablement pattern). Prefer S3/ODF in prod.
    type: filesystem
    size: 32Gi
  replicas: 1
  createDatabase: true
  migrateDatabase: true
  createImporters: true
  # Importers — CycloneDX SBOM + VEX/advisory related sources
  importers:
    cve:
      enabled: true
      description: "CVE list v5 (advisory ingestion)"
      period: 1d
      source: "https://github.com/CVEProject/cvelistV5"
    osvGithub:
      enabled: true
      description: "GitHub Advisory Database (OSV / advisory ingestion)"
      path: advisories
      period: 1d
      source: "https://github.com/github/advisory-database"
    redhatCsaf:
      # Heavy feed — off by default for workshop footprint
      enabled: false
      description: "All Red Hat CSAF / VEX-related advisories"
      fetchRetries: 50
      period: 1d
      source: redhat.com
    redhatSboms:
      # Heavy feed — off by default; learners upload CycloneDX via UI/API
      enabled: false
      description: "All Red Hat SBOMs"
      fetchRetries: 50
      period: 1d
      source: "https://access.redhat.com/security/data/sbom/beta/"
  server:
    resources:
      requests:
        cpu: "1"
        memory: 8Gi

# Documents CycloneDX SBOM + VEX ingestion for labs (ConfigMap)
ingestionInfo:
  enabled: true
  # Trustify 3 accepts CycloneDX from syft (commonly specVersion 1.5/1.6); 1.4 remains fine
  supportedCycloneDxVersion: "1.4+"

# RHDP userinfo ConfigMap
userInfo:
  enabled: true
  title: "Lightwell TSSC Workshop — Trusted Profile Analyzer"
  instructions: >-
    RHTPA is the SBOM / VEX system of record. Upload CycloneDX SBOMs (syft) via
    the TPA UI or API. RHDA is the optional IDE shift-left client on a laptop —
    not installed in Showroom (see docs/rhda-rhtpa-shift-left.md).

# Injected by root-app / field content workload
deployer:
  domain: ""
  apiUrl: ""
