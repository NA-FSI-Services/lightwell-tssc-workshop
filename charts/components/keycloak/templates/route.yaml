{{- if .Values.keycloak.enabled }}
{{- $host := include "keycloak.routeHost" . }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.keycloak.routeHostPrefix }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app: {{ .Values.keycloak.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.keycloak.syncWaves.route | quote }}
spec:
  host: {{ $host | quote }}
  to:
    kind: Service
    name: {{ .Values.keycloak.name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
