{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.admin.secretName }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.keycloak.syncWaves.config | quote }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.admin.username | quote }}
  password: {{ .Values.keycloak.admin.password | quote }}
{{- end }}
