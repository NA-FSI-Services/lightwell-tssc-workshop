{{- if and .Values.springBootLwPoc.enabled .Values.labDocs.enabled }}
{{- $appUrl := include "spring-boot-lw-poc.appUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-lw-poc-lab-docs
  namespace: {{ .Values.springBootLwPoc.namespace }}
  labels:
    {{- include "spring-boot-lw-poc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.springBootLwPoc.syncWaves.config | quote }}
data:
  COMMANDS.md: |
    # spring-boot-lw-poc — learner commands

    Sources: Gitea `student_repo_url` (`spring-boot-lw-poc`; `pom.xml` at clone root).
    Do not clone the workshop GitHub monorepo for app labs.

    ## Build / test (Validated stream)

    ```bash
    # From Showroom terminal after: git clone "${STUDENT_REPO_URL}" /tmp/spring-boot-lw-poc
    cd /tmp/spring-boot-lw-poc
    export LIGHTWELL_NEXUS_URL=https://nexus-lightwell-repo.{{ .Values.deployer.domain | default "apps.cluster.example.com" }}
    # Optional for live LWN / Nexus auth (never commit):
    # export LW_USERNAME=... LW_PASSWORD=...
    export MVN_LOCAL=-Dmaven.repo.local=/tmp/m2
    mvn $MVN_LOCAL -s settings.xml -Plightwell-validated clean verify
    mvn $MVN_LOCAL -s settings.xml -Plightwell-validated dependency:tree
    mvn $MVN_LOCAL -s settings.xml -Plightwell-validated spring-boot:run
    ```

    ## Remediated exact-version pins (`.rhlw-*`)

    ```bash
    mvn $MVN_LOCAL -s settings.xml -Plightwell-remediated,lightwell-remediated-pins clean verify
    mvn $MVN_LOCAL -s settings.xml -Plightwell-remediated,lightwell-remediated-pins dependency:tree
    ```

    Example pin in `pom.xml` profile `lightwell-remediated-pins`:
    `commons-lang3` → `3.14.0.rhlw-00001` (resolves from Lightwell Remediated / seeded Nexus).

    ## SBOM (CycloneDX) for RHTPA

    ```bash
    mvn -s settings.xml -Plightwell-validated -DskipTests package
    syft packages dir:. -o cyclonedx-json > sbom.cdx.json
    # Upload sbom.cdx.json to RHTPA (Module 4 / issue #17)
    ```

    ## HTTP / OpenAPI

    - Greeting: {{ $appUrl }}/api/greeting?name=Workshop
    - Health: {{ $appUrl }}/api/healthz
    - Swagger UI: {{ $appUrl }}/swagger-ui.html
    - OpenAPI: {{ $appUrl }}/api-docs

    Canonical LWN remotes (also via lightwell-repo Nexus):
    - https://packages.redhat.com/lightwell/java/validated
    - https://packages.redhat.com/lightwell/java/remediated
    - https://packages.redhat.com/lightwell/osv/java/remediated
{{- end }}
