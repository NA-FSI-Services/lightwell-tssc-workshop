# Lightwell TSSC Workshop — App of Apps
# AgnosticV gitops_path: charts/root-app
#
# Sync wave ordering (IdP → operators → config → apps → showroom):
#    5  — Workshop Keycloak (SSO for RHTPA): keycloak
#   10  — TSSC operators / platform: rhtas, rhtpa, rhacs
#   20  — Artifact manager / LWN pattern: lightwell-repo
#   30  — Developer Hub: rhdh
#   40  — Sample apps: spring-boot-lw-poc, parasol-app
#   50  — Showroom lab guide
#
# Child charts live under charts/components/<name>/ (Phase 1 issues).
# Keep components disabled until their charts exist and are ready to sync.

# ============================================================
# GitOps Configuration
# ============================================================
gitops:
  # Development repo until rhpds mirror exists (see DEVELOPMENT-PLAN.md)
  repoUrl: "https://github.com/NA-FSI-Services/lightwell-tssc-workshop.git"
  revision: "main"
  # Path prefix for child charts (root-app is at charts/root-app)
  basePath: "charts"

# ArgoCD settings
argocd:
  namespace: openshift-gitops
  project: default

# ============================================================
# Components — enable/disable and configure each child chart
# ============================================================
components:

  # --- Wave 5: Workshop IdP (required before RHTPA) ---
  # Chart: charts/components/keycloak. Route host sso.<deployer.domain>/realms/tpa.
  keycloak:
    enabled: false
    namespace: sso
    syncWave: "5"

  # --- Wave 10: TSSC operators / platform ---
  # Chart: charts/components/rhtas (#4). Enable when cluster is ready to sync.
  rhtas:
    enabled: false
    namespace: trusted-artifact-signer
    syncWave: "10"

  # Chart: charts/components/rhtpa (#5). Enable when SSO + cluster capacity are ready.
  rhtpa:
    enabled: false
    namespace: trusted-profile-analyzer
    syncWave: "10"

  # Chart: charts/components/rhacs (#6). Enable when cluster capacity is ready.
  rhacs:
    enabled: false
    namespace: stackrox
    syncWave: "10"

  # --- Wave 20: Artifact manager (validated / remediated / OSV) ---
  # Chart: charts/components/lightwell-repo (#7). Enable when ready to sync.
  lightwellRepo:
    enabled: false
    namespace: lightwell-repo
    syncWave: "20"
    # Chart directory under charts/components/
    chartPath: lightwell-repo

  # --- Wave 30: Developer Hub ---
  # Chart: charts/components/rhdh (#3). Enable when cluster is ready to sync.
  rhdh:
    enabled: false
    namespace: rhdh
    syncWave: "30"

  # --- Wave 40: Sample applications ---
  # Chart: charts/components/spring-boot-lw-poc (#24). Primary LWN Maven PoC.
  springBootLwPoc:
    enabled: false
    namespace: spring-boot-lw-poc
    syncWave: "40"
    chartPath: spring-boot-lw-poc

  # Chart: charts/components/parasol-app (#8). Optional; keep off for critical path.
  parasolApp:
    # Optional secondary enterprise workload (after spring-boot-lw-poc)
    enabled: false
    namespace: parasol
    syncWave: "40"
    chartPath: parasol-app

  # --- Wave 50: Showroom lab guide (Modules 1–5 via site.yml) ---
  showroom:
    enabled: true
    namespace: showroom
    name: showroom
    syncWave: "50"
    content:
      # Antora: site.yml → docs/modules/ROOT (Modules 1–5); chart charts/components/showroom (#19)
      repoUrl: "https://github.com/NA-FSI-Services/lightwell-tssc-workshop.git"
      repoRef: "main"
      antoraPlaybook: "site.yml"
      image: "quay.io/rhpds/showroom-content:v1.3.1"
    nookbag:
      # docs/SHOWROOM-UPDATE-SPEC.md — nookbag / zero-touch unsupported for this catalog path
      enabled: false
      bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.1/nookbag-v0.2.1.zip"
    terminal:
      enabled: true
      image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

# ============================================================
# Values injected by field content workload (do not modify)
# ============================================================
deployer:
  domain: ""
  apiUrl: ""

fieldContent:
  deploymentType: "helm"
