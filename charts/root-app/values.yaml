# Lightwell TSSC Workshop — App of Apps
# AgnosticV gitops_path: charts/root-app
#
# Sync wave ordering (operators → config → apps → showroom):
#   10  — TSSC operators / platform: rhtas, rhtpa, rhacs
#   20  — Artifact manager / LWN pattern: lightwell-repo
#   30  — Developer Hub: rhdh
#   40  — Sample apps: spring-boot-lw-poc, parasol-app
#   50  — Showroom lab guide
#
# Child charts live under charts/components/<name>/ (Phase 1 issues).
# Keep components disabled until their charts exist and are ready to sync.

# ============================================================
# GitOps Configuration
# ============================================================
gitops:
  # Development repo until rhpds mirror exists (see DEVELOPMENT-PLAN.md)
  repoUrl: "https://github.com/NA-FSI-Services/lightwell-tssc-workshop.git"
  revision: "main"
  # Path prefix for child charts (root-app is at charts/root-app)
  basePath: "charts"

# ArgoCD settings
argocd:
  namespace: openshift-gitops
  project: default

# ============================================================
# Components — enable/disable and configure each child chart
# ============================================================
components:

  # --- Wave 10: TSSC operators / platform ---
  # Chart: charts/components/rhtas (#4). Enable when cluster is ready to sync.
  rhtas:
    enabled: false
    namespace: trusted-artifact-signer
    syncWave: "10"

  rhtpa:
    enabled: false
    namespace: trusted-profile-analyzer
    syncWave: "10"

  rhacs:
    enabled: false
    namespace: stackrox
    syncWave: "10"

  # --- Wave 20: Artifact manager (validated / remediated / OSV) ---
  lightwellRepo:
    enabled: false
    namespace: lightwell-repo
    syncWave: "20"
    # Chart directory under charts/components/
    chartPath: lightwell-repo

  # --- Wave 30: Developer Hub ---
  # Chart: charts/components/rhdh (#3). Enable when cluster is ready to sync.
  rhdh:
    enabled: false
    namespace: rhdh
    syncWave: "30"

  # --- Wave 40: Sample applications ---
  springBootLwPoc:
    enabled: false
    namespace: spring-boot-lw-poc
    syncWave: "40"
    chartPath: spring-boot-lw-poc

  parasolApp:
    # Optional secondary enterprise workload
    enabled: false
    namespace: parasol
    syncWave: "40"
    chartPath: parasol-app

  # --- Wave 50: Showroom lab guide ---
  showroom:
    enabled: false
    namespace: showroom
    name: showroom
    syncWave: "50"
    content:
      # Point at this repo's AsciiDoc modules when Showroom wiring lands (#19)
      repoUrl: "https://github.com/NA-FSI-Services/lightwell-tssc-workshop.git"
      repoRef: "main"
      antoraPlaybook: "site.yml"
      image: "quay.io/rhpds/showroom-content:v1.3.1"
    nookbag:
      enabled: true
      bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.1/nookbag-v0.2.1.zip"
    terminal:
      enabled: true
      image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

# ============================================================
# Values injected by field content workload (do not modify)
# ============================================================
deployer:
  domain: ""
  apiUrl: ""

fieldContent:
  deploymentType: "helm"
