# https://pre-commit.com
# Install once per clone: brew install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: scripts/helm-lint.sh
        language: script
        files: ^charts/.*\.(ya?ml|tpl)$
        pass_filenames: true
