# https://pre-commit.com
# Install once per clone: brew install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: scripts/helm-lint.sh
        language: script
        files: ^charts/.*\.(ya?ml|tpl)$
        pass_filenames: true
      - id: asciidoc-check
        name: asciidoc structural check
        entry: scripts/asciidoc-check.sh
        language: script
        files: ^(docs/.*|site\.yml|site-ci\.yml|scripts/asciidoc-check\.sh)$
        pass_filenames: true
