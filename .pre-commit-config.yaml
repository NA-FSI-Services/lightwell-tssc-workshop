# https://pre-commit.com
# Install once per clone: brew install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: scripts/helm-lint.sh
        language: script
        files: ^charts/.*\.(ya?ml|tpl)$
        pass_filenames: true
      - id: asciidoc-check
        name: asciidoc structural check
        entry: scripts/asciidoc-check.sh
        language: script
        files: ^(docs/.*|site\.yml|site-ci\.yml|scripts/asciidoc-check\.sh)$
        pass_filenames: true
      - id: showroom-check
        name: showroom content contract
        entry: scripts/showroom-check.sh
        language: script
        files: ^(charts/components/showroom/.*|charts/root-app/values\.yaml|charts/root-app/templates/applications\.yaml|site\.yml|site-ci\.yml|docs/.*|scripts/showroom-check\.sh|docs/SHOWROOM-UPDATE-SPEC\.md)$
        pass_filenames: true
      - id: agnosticv-check
        name: agnosticv draft check
        entry: scripts/agnosticv-check.sh
        language: script
        files: ^(agnosticv/.*|scripts/agnosticv-check\.sh)$
        pass_filenames: true
