# Automation Manifest
# DRAFT — Generated at intake. The automation procedure refines this during development.
# See the automation manifest format guide for field reference.

approach: both  # ansible (setup) + gitops (Helm/Argo CD resources for the dedicated environment)

infrastructure:
  type: ocp-cnv           # per-student topology on CNV
  ocp_version: "4.20"
  multi_user: false
  users_per_deployment: 1  # per-student — each learner gets a dedicated environment (user `student`)

operators:
  # Pre-installed by automation — learners USE these, not install them
  - Red Hat OpenShift Pipelines
  - Red Hat OpenShift GitOps
  - Red Hat Advanced Cluster Security
  - Red Hat Trusted Profile Analyzer
  - Red Hat Developer Hub
  - Red Hat Trusted Artifact Signer

applications:
  - name: Nexus (Lightwell artifact manager)
    namespace: lightwell-repo
    notes: proxies packages.redhat.com/lightwell/* validated, remediated, and OSV tiers
  - name: Gitea
    namespace: gitea
    notes: source repos (spring-boot-lw-poc, fastapi-lw-poc) and gitops Helm repos under org lw-student
  - name: Keycloak / SSO
    namespace: sso
    notes: OIDC provider for RHTPA; TPA realm pre-configured
  - name: Validate Jobs
    namespace: lw-poc-validate
    notes: V2-51 scaffold — helper, 18 report ConfigMaps, learner-started Job templates (no Solve)

seed_data:
  - Namespaces lw-poc-build (pipelines), lw-poc-staging (stage app), lw-poc-prod (prod app); Python twin lw-fastapi-student stays off (V2-12)
  - Namespace lw-poc-validate (Validate Jobs; V2-51)
  - ConfigMaps (lightwell-channels, demo-userinfo-rhdh, lightwell-pip-settings, demo-userinfo-gitea, demo-userinfo-keycloak, demo-userinfo-validate)
  - Report ConfigMaps report-01-hummingbird-verify … report-18-vex-acs (seed status REPLACE_ME)
  - Seeded Gitea template remotes; learner org lw-student (spring-boot-lw-poc, fastapi-lw-poc, gitops-java, gitops-fastapi)
  - Tekton Pipeline definitions (lightwell-dep-gate Java, lightwell-python-dep-gate Python)
  - RHDH Software Templates (lightwell-java-service, lightwell-python-service)
  - OSV evaluation scripts pre-staged in tools/osv-eval/scripts/

notes: >
  qa-automation healthcheck confirms provisioned objects; e2e asserts the
  fresh-claim negatives (no Solve). Pass-path is in-cluster Validate Jobs (V2-54).
  V2-51 scaffold: GitOps chart validate-jobs (namespace lw-poc-validate, shared
  helper, 18 report ConfigMaps, learner-started Job templates). No runtime-automation/.
  External services required: packages.redhat.com (Lightwell registry, proxied via Nexus),
  registry.access.redhat.com (learner oc-mirror). Gitea is in-cluster.
