project:
  slug: "lightwell-tssc-workshop"
  owner_email: "treddy@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "migration"
  description: "Learners practice the same integration patterns used in Lightwell Network proof-of-value delivery: Validated and Remediated repositories, Maven and PyPI consumption via an enterprise artifact manager, OSV-driven exact-version pins (.rhlw-*), SBOM analysis, and TSSC pipeline controls. This catalog is Java and Python: Modules 1–6 (Java), then Modules 7–9 (FastAPI / PyPI — epic #144, complete). PyPI Remediated is always enabled (seeded .rhlw-* marker)."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-908"
  workflow_id: "61d499a1-cfec-4d29-ad00-9f09dd08116e"

spec:
  title: "Lightwell Software Supply Chain Security Workshop"
  learning_objectives:
    - "Verify Lightwell Network tiers and OSV remediation events using the oc CLI and cluster ConfigMaps"
    - "Configure Maven settings.xml and pip.conf to resolve artifacts from enterprise-proxied Lightwell channels"
    - "Scaffold Java and Python application repositories from Red Hat Developer Hub Software Templates"
    - "Analyze OSV fixed events and apply exact-version .rhlw-* pins to pom.xml and requirements.txt"
    - "Generate CycloneDX and SPDX SBOMs from build output using syft"
    - "Ingest SBOMs into Red Hat Trusted Profile Analyzer via the v3 API"
    - "Verify supply-chain policy gates in Tekton pipelines for both the Java and Python application tracks"
    - "Sign container images keylessly using Red Hat Trusted Artifact Signer (Fulcio, Rekor, TUF)"
    - "Promote signed image digests to GitOps repositories for Argo CD deployment"
  modules:
    - id: module-01
      title: "AI Vulnerability Storm and Lightwell Network Overview"
      duration_min: 20
      status: not_started
    - id: module-02
      title: "Enterprise Maven + Artifact Manager Integration"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Developer Hub Scaffolding (Java Golden Path)"
      duration_min: 25
      status: not_started
    - id: module-04
      title: "OSV Triage and Exact-Version Remediation"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "SBOM Generation and Analysis with RHTPA"
      duration_min: 20
      status: not_started
    - id: module-06
      title: "Pipeline, Signing, Policy, and GitOps Promotion (Java)"
      duration_min: 45
      status: not_started
    - id: module-07
      title: "PyPI Validated + FastAPI (Python Track Kickoff)"
      duration_min: 30
      status: not_started
    - id: module-08
      title: "Remediated PyPI + SPDX/SBOM to RHTPA"
      duration_min: 25
      status: not_started
    - id: module-09
      title: "Python Pipeline, Sign, Policy, and GitOps Promotion"
      duration_min: 40
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                 # minimum version; confirmed in infrastructure phase
    cluster_type: "multinode"           # sno | multinode
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 2
    worker_cpu: 16
    worker_ram_gb: 64
    worker_disk_gb: 2000

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # not applicable — AAP not a product under instruction
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # not applicable
    ai_model_name: ""                  # not applicable
    ai_justification: ""               # not applicable
    non_ga_products: []                # none identified
    non_ga_access_plan: ""             # not applicable
    external_services:
      - "packages.redhat.com"          # Lightwell package registry proxied via Nexus
      - "github.com"                   # cosign binary download from sigstore/cosign releases
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # not applicable
  duration_hours: 4
  audience: "intermediate"    # beginner | intermediate | advanced

