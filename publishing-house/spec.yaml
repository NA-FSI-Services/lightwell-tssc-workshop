      duration_min: 0
      status: not_started
    - id: module-06
      title: "3.2 Bind base + deps in source"
      duration_min: 0
      status: not_started
    - id: module-07
      title: "3.3 Live Renovate"
      duration_min: 0
      status: not_started
    - id: module-08
      title: "4.1 Source forbid-list"
      duration_min: 0
      status: not_started
    - id: module-09
      title: "4.2 Prefetch (Hermeto mapping)"
      duration_min: 0
      status: not_started
    - id: module-10
