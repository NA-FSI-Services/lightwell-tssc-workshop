      duration_min: 0
      status: not_started
    - id: module-12
      title: "5.1 Sign (keyless)"
      duration_min: 0
      status: not_started
    - id: module-13
      title: "5.2 Attest + Conforma"
      duration_min: 0
      status: not_started
    - id: module-14
      title: "5.3 Disconnected verify"
      duration_min: 0
      status: not_started
    - id: module-15
