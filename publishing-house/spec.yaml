# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "lightwell-tssc-workshop"
  owner_email: "treddy@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "gitops"
  description: "Learners walk one linear TSSC path on a dedicated OpenShift claim: verify and mirror a Hummingbird base, consume Lightwell dependencies through an enterprise Nexus proxy, own application source (including a live Renovate PR), build hermetically with OpenShift Pipelines + BuildConfig, sign and attest, promote via stage then prod GitOps with admission, and prove continuous compliance with Lightwell GAV-bound VEX. Java is the scored app. Python and Artifactory are callouts, not a second path."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-908"
  workflow_id: "61d499a1-cfec-4d29-ad00-9f09dd08116e"

spec:
  title: "Lightwell Software Supply Chain Security Workshop"
  learning_objectives:
    - "Complete a trust policy and verify a published Hummingbird image (amd64 digest; arm64 is a callout)"
    - "Edit an incomplete ImageSetConfiguration and run oc-mirror so image, signatures, and SBOM land in the in-cluster dest"
    - "Author Maven settings.xml so Lightwell Validated and Remediated resolve from the enterprise Nexus proxy"
    - "Apply an exact-version .rhlw-* pin from a Lightwell OSV fixed event on a broken pom.xml"
    - "Bind application source to the mirrored Hummingbird digest and Lightwell pins"
    - "Merge a live Renovate PR on in-cluster Gitea that updates those pins (not a hand-edit)"
    - "Enforce a hermetic build: source forbid-list, prefetch task, and build-namespace NetworkPolicy"
    - "Produce an OpenShift BuildConfig image and SBOM"
    - "Sign the app image keylessly with RHTAS and tighten Conforma so a known-bad image fails"
    - "Complete mirrored-TUF plus key-based cosign verify (disconnected procedure, not a physical air-gap)"
    - "Promote a signed digest through stage GitOps with unsigned-deny admission, then commit it to the prod GitOps remote"
    - "Ingest Lightwell GAV-bound VEX/SBOM into TPA and report the CVE as remediated via the Lightwell pin"
  # Coverage-first gated list (plan §4.4). duration_min 0 = untimed until dry run. Intro is ungated (no Validate Job).
  modules:
    - id: module-00
      title: "Trusted supply chain (ungated intro)"
      duration_min: 0
      status: not_started
