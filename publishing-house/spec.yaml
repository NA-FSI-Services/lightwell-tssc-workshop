# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Observable outcomes per module (CLI output, UI state, curl response codes) — no automated solve/validate buttons"
    catalog_gap: ""
    design_overview: "This lab teaches enterprise software supply chain security using Red Hat Lightwell Network and the TSSC toolchain across Java (Modules 1-6) and Python (Modules 7-9) tracks. Participants configure Maven and PyPI consumers against a Nexus proxy, perform OSV-driven exact-version remediation, generate and ingest SBOMs into RHTPA, execute policy-gated Tekton pipelines, sign images keylessly with RHTAS, and promote via Argo CD."
    module_summaries:
      - title: "AI Vulnerability Storm and Lightwell Network Overview"
        overview: "Conceptual foundation covering the remediation gap Lightwell Network addresses, the Validated/Remediated/OSV tier model, and how supply-chain metadata travels with artifacts. Learners inspect in-cluster ConfigMaps and review a sample OSV fixed event."
      - title: "Enterprise Maven + Artifact Manager Integration"
        overview: "Demonstrates the three enterprise artifact consumption patterns (direct, proxied, seeded) and wires Maven settings.xml profiles to a Nexus instance proxying Lightwell tiers. Learners prove Validated and Remediated resolution by running mvn clean verify against the Spring Boot PoC."
      - title: "Developer Hub Scaffolding (Java Golden Path)"
        overview: "Transitions from the manually seeded Module 2 repository to the canonical developer golden path via a RHDH Software Template. Learners delete the seeded Gitea repo, scaffold via lightwell-java-service, and re-run Maven stream proofs."
      - title: "OSV Triage and Exact-Version Remediation"
        overview: "Walks learners through the complete remediation evaluation loop: reading an OSV fixed event, diffing upstream vs. remediated sources jar, updating pom.xml, and rebuilding to confirm commons-lang3:3.14.0.rhlw-00001 in the dependency tree."
      - title: "SBOM Generation and Analysis with RHTPA"
        overview: "Covers supply-chain metadata as a system of record, distinguishing RHTPA from RHDA. Learners SSO into the TPA UI, generate a CycloneDX SBOM using syft, and ingest it via the RHTPA v3 API using a bearer token obtained by OIDC password grant."
      - title: "Pipeline, Signing, Policy, and GitOps Promotion (Java)"
        overview: "Closes the full Java trusted supply-chain loop. Learners trigger a dep-gate failure on the un-remediated pin, update pom.xml to pass the gate, complete RHACS image check, upload SBOM, keylessly sign with cosign, and promote the signed digest via Argo CD."
      - title: "PyPI Validated + FastAPI (Python Track Kickoff)"
        overview: "Mirrors the Module 2-3 Java pattern for Python/PyPI. Learners extract pip.conf from a ConfigMap, seed Gitea repositories, prove httpx resolves from the validated Nexus index, and re-scaffold via the lightwell-python-service RHDH Software Template."
      - title: "Remediated PyPI + SPDX/SBOM to RHTPA"
        overview: "Parallels Modules 4-5 for Python. Confirms Remediated PyPI is enabled, pins the workshop marker package using PEP 440 local +rhlw.00001 syntax, generates both SPDX and CycloneDX SBOMs using syft, and ingests CycloneDX into RHTPA."
      - title: "Python Pipeline, Sign, Policy, and GitOps Promotion"
        overview: "Closes the Python trusted supply-chain loop mirroring Module 6. Learners run the lightwell-python-dep-gate Tekton task (fail then pass), sign the image keylessly via RHTAS, and promote the signed digest to the Python gitops Helm repo for Argo CD sync."
    rcars_overlap_pct: 100
    rcars_top_matches:
      - title: "Enhancing Developer Efficiency and Security with Trusted Application Pipeline"
        ci_name: "sandboxes-gpte.enhancing-developer.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.enhancing-developer.prod"
        relevance_score: 100
        why_it_fits: "Covers the full RHTAP stack — RHTAS, RHTPA, RHACS, OpenShift Pipelines, OpenShift GitOps, RHDH — with hands-on signing, SBOM ingestion, and GitOps promotion."
      - title: "Build Secure, Streamlined Developer Workflows with Red Hat Advanced Developer Suite"
        ci_name: "published.rhads-secure-dev-workflows.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.rhads-secure-dev-workflows.prod"
        relevance_score: 91
        why_it_fits: "Covers all six requested products with dedicated content on SBOM ingest, keyless signing, Tekton policy gates via Enterprise Contract, and GitOps-driven promotion."
      - title: "LB1464: Unifying DevSecOps: Secure, Standardized Application Delivery Across Containers (CNV)"
        ci_name: "summit-2026.lb1464-unified-devsecops-delivery-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb1464-unified-devsecops-delivery-cnv.prod"
        relevance_score: 88
        why_it_fits: "Covers TSSC full stack including TAS, TPA, RHACS, RHDH, Tekton, and Argo CD with supply-chain policy enforcement and keyless signing."
    catalog_gap: "No existing catalog item teaches the Lightwell Network consumption model — the Validated/Remediated/OSV tier structure, .rhlw-* exact-version pinning via OSV event analysis, or the parallel Java and Python remediation tracks integrated end-to-end with TSSC pipeline policy gates and GitOps promotion."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
