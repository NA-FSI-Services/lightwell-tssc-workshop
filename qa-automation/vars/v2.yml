# Shared names for V2-22 health / negative e2e.
# Fresh-claim contract: seeds stay incomplete; unsigned deny is not live.

build_namespace: lw-poc-build
stage_namespace: lw-poc-staging
prod_namespace: lw-poc-prod
gitea_namespace: gitea
admission_namespace: tssc-admission
repo_namespace: lightwell-repo
tasks_namespace: lightwell-tasks
showroom_namespace: showroom

build_policy: build-egress
operate_policy: app-operate
admission_policy: tssc-prod-admission

imageset_configmap: imageset-configuration
imageset_key: imageset-config.yaml
oc_mirror_tooling: oc-mirror-tooling
oc_mirror_pvc: oc-mirror-workspace
oc_mirror_job: oc-mirror-learner
dest_repo: hummingbird-mirror
