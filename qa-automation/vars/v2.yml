# Shared names for V2-22 health / negative e2e.
# Fresh-claim contract: seeds stay incomplete; unsigned deny is not live.

build_namespace: lw-poc-build
stage_namespace: lw-poc-staging
prod_namespace: lw-poc-prod
gitea_namespace: gitea
admission_namespace: tssc-admission
repo_namespace: lightwell-repo
tasks_namespace: lightwell-tasks
showroom_namespace: showroom

build_policy: build-egress
operate_policy: app-operate
admission_policy: tssc-prod-admission

imageset_configmap: imageset-configuration
imageset_key: imageset-config.yaml
oc_mirror_tooling: oc-mirror-tooling
oc_mirror_pvc: oc-mirror-workspace
oc_mirror_job: oc-mirror-learner
dest_repo: hummingbird-mirror
repo_userinfo: demo-userinfo-lightwell-repo
imageset_placeholder: REPLACE_ME_HUMMINGBIRD_PULLSPEC

# V2-53 incomplete ConfigMaps in lightwell-repo (Jobs grade these, not ~/ only).
gitea_overlay_known_bad_key: overlay-Dockerfile.known-bad
gitea_overlay_pipeline_key: overlay-tekton-pipeline.yaml
acs_fail_on_skipped_stub: 'value: "false"'
lab_stubs:
  - name: stub-01-hummingbird-verify
    key: published-verify.sh
    must_contain: REPLACE_ME_HUMMINGBIRD_PULLSPEC
  - name: stub-03-enterprise-proxy
    key: settings.xml
    must_contain: REPLACE_ME_NEXUS_URL
  - name: stub-04-remediated-pin
    key: pom.xml
    must_contain: ">3.14.0<"
  - name: stub-18-blast-radius
    key: blast-radius.txt
    must_contain: REPLACE_ME_VEX_ID

apply_cronjob: trust-policy-apply
gitea_seed_configmap: gitea-student-repo-seed
gitea_userinfo: demo-userinfo-gitea
showroom_userinfo: demo-userinfo-showroom
trust_policy_seed_key: overlay-gitops-admission-trust-policy.yaml

verify_task: verify-base-image
conforma_task: conforma-policy
conforma_configmap: conforma-policy
prefetch_task: prefetch-dependencies

app_imagestream: spring-boot-lw-poc

validate_namespace: lw-poc-validate
validate_scripts: validate-scripts
validate_templates: validate-job-templates
validate_userinfo: demo-userinfo-validate
validate_docs: validate-docs
validate_sa: validate-jobs
validate_clusterrole: validate-jobs
report_placeholder: REPLACE_ME
validate_job_wait_timeout: 180s
# Keep in sync with automation/gitops/components/validate-jobs/values.yaml modules.
validate_modules:
  - id: "01"
    job: validate-01-hummingbird-verify
    report: report-01-hummingbird-verify
    quiz_key: consume_published
  - id: "02"
    job: validate-02-hummingbird-mirror
    report: report-02-hummingbird-mirror
    quiz_key: learner_runs_mirror
  - id: "03"
    job: validate-03-enterprise-proxy
    report: report-03-enterprise-proxy
    quiz_key: proxy_standin
  - id: "04"
    job: validate-04-remediated-pin
    report: report-04-remediated-pin
    quiz_key: pin_kind
  - id: "05"
    job: validate-05-golden-path-source
    report: report-05-golden-path-source
    quiz_key: git_home
  - id: "06"
    job: validate-06-bind-base-deps
    report: report-06-bind-base-deps
    quiz_key: runtime_from
  - id: "07"
    job: validate-07-live-renovate
    report: report-07-live-renovate
    quiz_key: who_changed_pins
  - id: "08"
    job: validate-08-forbid-list
    report: report-08-forbid-list
    quiz_key: hermetic_starts
  - id: "09"
    job: validate-09-prefetch
    report: report-09-prefetch
    quiz_key: hermeto_maps_to
  - id: "10"
    job: validate-10-build-networkpolicy
    report: report-10-build-networkpolicy
    quiz_key: np_scope
  - id: "11"
    job: validate-11-build-sbom
    report: report-11-build-sbom
    quiz_key: image_builder
  - id: "12"
    job: validate-12-sign-keyless
    report: report-12-sign-keyless
    quiz_key: what_you_signed
  - id: "13"
    job: validate-13-attest-conforma
    report: report-13-attest-conforma
    quiz_key: policy_owner
  - id: "14"
    job: validate-14-disconnected-verify
    report: report-14-disconnected-verify
    quiz_key: diode_honest
  - id: "15"
    job: validate-15-gitops-admission
    report: report-15-gitops-admission
    quiz_key: live_api
  - id: "16"
    job: validate-16-prod-gitops
    report: report-16-prod-gitops
    quiz_key: how_promote
  - id: "17"
    job: validate-17-sbom-sor
    report: report-17-sbom-sor
    quiz_key: sor_object
  - id: "18"
    job: validate-18-vex-acs
    report: report-18-vex-acs
    quiz_key: vex_layer
