---
# Lightweight Antora playbook for CI (no Showroom UI extensions).
# Showroom runtime continues to use site.yml (mermaid/tabs + RHDP theme).
# Omit site.url so generated pages do not advertise a GitHub home link to learners.
site:
  title: Lightwell Software Supply Chain Security Workshop
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: docs

ui:
  bundle:
    # Same RHDP Showroom theme as site.yml; CI omits mermaid/tabs extensions for a faster generate
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true

runtime:
  log:
    # Fail CI when AsciiDoc reports unresolved xrefs / include errors
    failure_level: error

output:
  dir: ./www
