---
# Antora playbook for RHDP Showroom (automation/bootstrap-infra → antoraPlaybook: site.yml)
# Omit site.url so the Showroom title/canonical links stay in-cluster (no GitHub chrome).
site:
  title: Lightwell Software Supply Chain Security Workshop
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true

output:
  dir: ./www
