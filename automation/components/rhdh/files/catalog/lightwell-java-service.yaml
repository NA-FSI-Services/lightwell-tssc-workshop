# Software Template — lightwell-java-service (issue #12 / #120)
# Skeleton: workshop-templates/lightwell-java-service (Gitea; seeded from
#   automation/components/rhdh/files/skeletons/lightwell-java-service by gitea seed Job)
# Publish target: in-cluster Gitea only (AGENTS.md Learner Git). Host substituted at install:
#   GITEA_HOST_PLACEHOLDER → gitea.<deployer.domain>
# Learner org lw-<studentUsername> (created in Module 2) + repo spring-boot-lw-poc.
# Upstream publish:gitea requires a Gitea Organization (not a normal user).
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: lightwell-java-service
  title: Lightwell Java Service
  description: >-
    Spring Boot / Java 17 / Maven microservice golden path with Lightwell Network
    Validated and Remediated Maven profiles, env-based LW_* auth, .rhlw-* pins,
    tools/osv-eval helpers, and a Tekton pipeline that keyless-signs with RHTAS (cosign).
    Publishes to workshop Gitea as lw-<student_username>/spring-boot-lw-poc.
  tags:
    - lightwell
    - java
    - maven
    - spring-boot
    - rhtas
    - gitea
    - recommended
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/lightwell-workshop
  type: service
  parameters:
    - title: Service information
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Maven artifactId and Kubernetes-safe service name
          pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'
          default: spring-boot-lw-poc
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: Spring Boot service using Lightwell Network Maven streams
        owner:
          title: Owner
          type: string
          default: group:default/lightwell-workshop
        system:
          title: System
          type: string
          default: lightwell-tssc-workshop
        groupId:
          title: Maven groupId
          type: string
          default: com.redhat.lightwell.workshop
        javaPackage:
          title: Java package
          type: string
          default: com.redhat.lightwell.workshop
          description: Used in package declarations (match javaPath below)
        javaPath:
          title: Java source path
          type: string
          default: com/redhat/lightwell/workshop
          description: Directory path under src/main/java (slashes, not dots)
    - title: Lightwell Network
      properties:
        lwnProfile:
          title: Default settings.xml active profile
          type: string
          default: lightwell-validated
          enum:
            - lightwell-validated
            - lightwell-remediated
          enumNames:
            - Validated (upstream-parity rebuilds)
            - Remediated (use with lightwell-remediated-pins for .rhlw-*)
    - title: Publication (Gitea)
      required:
        - studentUsername
      properties:
        studentUsername:
          title: Gitea student username
          type: string
          description: >-
            Paste student_username from ConfigMap demo-userinfo-gitea.
            Publishes under organization lw-<this value> (create that org in Module 2).
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9._-]{0,38}[a-zA-Z0-9])?$'
        repoOwner:
          title: Gitea organization
          type: string
          description: >-
            Must be lw-<student_username> (your Module 2 organization).
            Upstream publish:gitea creates repositories under Organizations only.
          pattern: '^lw-[a-zA-Z0-9]([a-zA-Z0-9._-]{0,38}[a-zA-Z0-9])?$'
          default: lw-student
        repoName:
          title: Repository name
          type: string
          const: spring-boot-lw-poc
          default: spring-boot-lw-poc
          description: Fixed so student_repo_url stays stable for Modules 4–6
        defaultBranch:
          title: Default branch
          type: string
          default: main
  steps:
    - id: fetch-base
      name: Fetch Lightwell Java skeleton
      action: fetch:template
      input:
        # GiteaUrlReader requires .../src/branch/<ref> (plain owner/repo yields commits/undefined).
        url: https://GITEA_HOST_PLACEHOLDER/workshop-templates/lightwell-java-service/src/branch/main
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          groupId: ${{ parameters.groupId }}
          javaPackage: ${{ parameters.javaPackage }}
          javaPath: ${{ parameters.javaPath }}
          lwnProfile: ${{ parameters.lwnProfile }}
          repoOwner: ${{ parameters.repoOwner }}
          repoName: spring-boot-lw-poc

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: GITEA_HOST_PLACEHOLDER?owner=${{ parameters.repoOwner }}&repo=spring-boot-lw-poc
        defaultBranch: ${{ parameters.defaultBranch }}
        repoVisibility: public

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        # Use catalogInfoUrl — Gitea resolveUrl drops the branch when catalogInfoPath
        # starts with "/" (produces .../src/branch/catalog-info.yaml → 400).
        catalogInfoUrl: ${{ steps.publish.output.repoContentsUrl }}catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Modules 3–6 next steps
        content: |
          Scaffolded **${{ parameters.name }}** to Gitea
          `https://GITEA_HOST_PLACEHOLDER/${{ parameters.repoOwner }}/spring-boot-lw-poc`
          (must match demo-userinfo-gitea → student_repo_url).

          **Module 3 — Maven proofs on the scaffold**
          ```bash
          export LIGHTWELL_NEXUS_URL='https://nexus-lightwell-repo.apps.<domain>'
          export MVN_LOCAL='-Dmaven.repo.local=/tmp/m2'
          mvn $MVN_LOCAL -s settings.xml -Plightwell-validated clean verify
          mvn $MVN_LOCAL -s settings.xml -Plightwell-remediated,lightwell-remediated-pins clean verify
          ```

          **Module 4 — Exact-version remediation**
          Use `tools/osv-eval/` then pin `.rhlw-*` and rebuild.

          **Module 5 — SBOM / RHTPA**
          Generate CycloneDX (e.g. `syft`) and import into Trusted Profile Analyzer.

          **Module 6 — Sign / policy / GitOps**
          Apply `.tekton/pipeline.yaml` for **RHTAS keyless** `cosign sign`, then optional RHACS / promote.

          Canonical remotes:
          - https://packages.redhat.com/lightwell/java/validated
          - https://packages.redhat.com/lightwell/java/remediated
          - https://packages.redhat.com/lightwell/osv/java/remediated
