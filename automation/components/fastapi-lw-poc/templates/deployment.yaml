{{- if .Values.fastapiLwPoc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fastapiLwPoc.name }}
  namespace: {{ .Values.fastapiLwPoc.namespace }}
  labels:
    {{- include "fastapi-lw-poc.labels" . | nindent 4 }}
    app: {{ .Values.fastapiLwPoc.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.fastapiLwPoc.syncWaves.workload | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.fastapiLwPoc.name }}
  template:
    metadata:
      labels:
        {{- include "fastapi-lw-poc.labels" . | nindent 8 }}
        app: {{ .Values.fastapiLwPoc.name }}
    spec:
      containers:
        - name: fastapi-lw-poc
          image: {{ include "fastapi-lw-poc.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: LIGHTWELL_STREAM
              value: {{ .Values.lightwellStream | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
{{- end }}
