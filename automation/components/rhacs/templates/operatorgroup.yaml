{{- if and .Values.rhacs.enabled .Values.operator.enabled .Values.operator.createOperatorGroup }}
---
# Dedicated OperatorGroup for RHACS Operator (AllNamespaces watch).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.operator.name }}-operator-group
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.operator | quote }}
spec: {}
{{- end }}
