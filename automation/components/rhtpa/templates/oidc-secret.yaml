{{- if .Values.rhtpa.enabled }}
---
# CLI OIDC client secret referenced by TrustedProfileAnalyzer.
# Override oidc.cliClientSecret via RHDP secret injection — do not use workshop defaults in prod.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.cliSecretName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhtpa.syncWaves.secrets | quote }}
type: Opaque
stringData:
  cli: {{ .Values.oidc.cliClientSecret | quote }}
{{- end }}
