# Example PipelineRun — edit repo-url / image-url / Fulcio / Rekor for your claim.
# repo-url: Module 6 substitutes STUDENT_REPO_URL for STUDENT_REPO_URL_PLACEHOLDER
# (never hardcode lw-<user>; learners set this in lab steps from demo-userinfo-gitea).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: spring-boot-lw-poc-build-sign-
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  pipelineRef:
    name: spring-boot-lw-poc-build-sign
  params:
    - name: repo-url
      value: STUDENT_REPO_URL_PLACEHOLDER
    - name: revision
      value: main
    # Learner lab namespace ImageStream (not GitOps spring-boot-lw-poc NS — see #100)
    - name: image-url
      value: image-registry.openshift-image-registry.svc:5000/<lab-namespace>/spring-boot-lw-poc:latest
    - name: buildconfig-name
      value: spring-boot-lw-poc
    - name: cosign-fulcio-url
      value: https://fulcio-server-trusted-artifact-signer.apps.<domain>
    - name: cosign-rekor-url
      value: https://rekor-server-trusted-artifact-signer.apps.<domain>
    - name: cosign-tuf-url
      value: https://tuf-trusted-artifact-signer.apps.<domain>
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    - name: sbom
      emptyDir: {}
  taskRunTemplate:
    serviceAccountName: pipeline
