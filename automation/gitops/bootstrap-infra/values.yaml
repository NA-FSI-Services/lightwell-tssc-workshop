# Lightwell TSSC Workshop — Bootstrap Infra
# AgnosticV gitops_path: automation/gitops/bootstrap-infra
#
# Sync wave ordering (IdP → pipelines → operators → student git → config → apps → showroom):
#    5  — Workshop Keycloak (SSO for RHTPA): keycloak
#    8  — OpenShift Pipelines (Tekton CRDs for Module 5 / RHACS Tasks): pipelines
#   10  — TSSC operators / platform: rhtas, rhtpa, rhacs, admission
#   15  — Student Git (Gitea): gitea
#   20  — Artifact manager / LWN pattern: lightwell-repo
#   30  — Developer Hub: rhdh
#   40  — Sample apps: spring-boot-lw-poc (scored), fastapi-lw-poc (unused at provision; V2-12), parasol-app
#   50  — Showroom lab guide
#
# Child charts live under automation/gitops/components/<name>/.

# ============================================================
# GitOps Configuration
# ============================================================
gitops:
  repoUrl: "https://github.com/rhpds/lightwell-tssc-workshop.git"
  revision: "main"
  basePath: "automation/gitops"

# ArgoCD settings
argocd:
  namespace: openshift-gitops
  project: default

# ============================================================
# Components — enable/disable and configure each child chart
# ============================================================
components:

  # --- Wave 5: Workshop IdP (required before RHTPA) ---
  # Chart: automation/gitops/components/keycloak. Route host sso.<deployer.domain>/realms/tpa.
  keycloak:
    enabled: false
    namespace: sso
    syncWave: "5"

  # --- Wave 8: OpenShift Pipelines (Tekton) — enable before rhacs Module 5 Tasks ---
  # Chart: automation/gitops/components/pipelines. OLM Subscription into openshift-operators.
  pipelines:
    enabled: false
    namespace: openshift-operators
    syncWave: "8"

  # --- Wave 10: TSSC operators / platform ---
  # Chart: automation/gitops/components/rhtas (#4). Enable when cluster is ready to sync.
  rhtas:
    enabled: false
    namespace: trusted-artifact-signer
    syncWave: "10"

  # Chart: automation/gitops/components/rhtpa (#5). Enable when SSO + cluster capacity are ready.
  rhtpa:
    enabled: false
    namespace: trusted-profile-analyzer
    syncWave: "10"

  # Chart: automation/gitops/components/rhacs (#6). Enable when cluster capacity is ready.
  rhacs:
    enabled: false
    namespace: stackrox
    syncWave: "10"

  # Chart: automation/gitops/components/admission (V2-16). Enable with rhtas.
  # Learner TrustPolicy → namespaced ImagePolicy. Do not score ClusterImagePolicy.
  admission:
    enabled: false
    namespace: tssc-admission
    syncWave: "10"

  # --- Wave 15: Student Git (learner repos for Module 5 — not the GitOps monorepo) ---
  # Chart: automation/gitops/components/gitea. Seeds the student app + gitops remotes; Application → lw-poc-student.
  gitea:
    enabled: false
    namespace: gitea
    syncWave: "15"
    # Lab user (one per dedicated environment)
    studentUsername: student
    repoName: spring-boot-lw-poc
    repoRevision: main
    pomPath: pom.xml
    # Python twin names kept for V2-90; not provisioned (V2-12).
    pythonRepoName: fastapi-lw-poc

  # --- Wave 20: Artifact manager (validated / remediated / OSV) ---
  # Chart: automation/gitops/components/lightwell-repo (#7). Enable when ready to sync.
  lightwellRepo:
    enabled: false
    namespace: lightwell-repo
    syncWave: "20"
    # Chart directory under automation/gitops/components/
    chartPath: lightwell-repo

  # --- Wave 30: Developer Hub ---
  # Chart: automation/gitops/components/rhdh (#3 / #120). Enabled with lab stack for Module 3 scaffold.
  rhdh:
    enabled: true
    namespace: rhdh
    syncWave: "30"

  # --- Wave 40: Sample applications ---
  # Chart: automation/gitops/components/spring-boot-lw-poc (#24). Keep disabled when Gitea gitops
  # Argo Application lw-poc-student is the runtime SoT (Module 6 Ex4 / #100 M1). Enable only for monorepo demos.
  springBootLwPoc:
    enabled: false
    namespace: spring-boot-lw-poc
    syncWave: "40"
    chartPath: spring-boot-lw-poc

  # Chart: automation/gitops/components/fastapi-lw-poc. Keep off (V2-12). Files stay
  # in git for V2-44 callouts / V2-90. Do not enable as a second catalog namespace.
  fastapiLwPoc:
    enabled: false
    namespace: fastapi-lw-poc
    syncWave: "40"
    chartPath: fastapi-lw-poc

  # Chart: automation/gitops/components/parasol-app (#8). Optional; keep off for critical path.
  parasolApp:
    # Optional secondary enterprise workload (after spring-boot-lw-poc)
    enabled: false
    namespace: parasol
    syncWave: "40"
    chartPath: parasol-app

  # --- Wave 50: Showroom lab guide (Modules 1–6 via site.yml) ---
  showroom:
    enabled: true
    namespace: showroom
    name: showroom
    syncWave: "50"
    content:
      # Antora: site.yml → docs/modules/ROOT (Modules 1–6); chart automation/gitops/components/showroom (#19)
      repoUrl: "https://github.com/rhpds/lightwell-tssc-workshop.git"
      repoRef: "main"
      antoraPlaybook: "site.yml"
      image: "quay.io/rhpds/showroom-content:v1.3.1"
    nookbag:
      # ZT UI shell for split-screen via repo-root ui-config.yml (lab + /terminal/).
      # Full zero-touch / LlamaStack automation remains out of scope (SHOWROOM-UPDATE-SPEC).
      enabled: true
      bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip"
    terminal:
      enabled: true
      image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
      # Required for Module 1–5 Showroom terminal `oc` across lab namespaces
      labClusterAccess: true
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

# ============================================================
# Values injected by field content workload (do not modify)
# ============================================================
deployer:
  domain: ""
  apiUrl: ""

fieldContent:
  deploymentType: "helm"
