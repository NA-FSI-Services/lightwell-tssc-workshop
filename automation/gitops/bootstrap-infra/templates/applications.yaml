{{- if .Values.components.gitea.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-gitea
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "root-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.gitea.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/gitea
    helm:
      valuesObject:
        gitea:
          enabled: {{ .Values.components.gitea.enabled }}
          namespace: {{ .Values.components.gitea.namespace }}
        seed:
          repoName: {{ .Values.components.gitea.repoName | quote }}
          defaultBranch: {{ .Values.components.gitea.repoRevision | quote }}
          # Operator-only clone to isolate learner app path into Gitea (not a student GitHub step)
          source:
            mode: live
            repoUrl: {{ .Values.gitops.repoUrl | quote }}
            revision: {{ .Values.gitops.revision | quote }}
            path: automation/gitops/components/spring-boot-lw-poc/app
        deployer:
          domain: {{ .Values.deployer.domain | quote }}
          apiUrl: {{ .Values.deployer.apiUrl | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.gitea.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

