{{- if .Values.renovate.enabled }}
---
# Filled by Job renovate-bot-token. Never commit a real Gitea token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bot.tokenSecretName }}
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.config | quote }}
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  token: "REPLACE_ME"
{{- end }}
