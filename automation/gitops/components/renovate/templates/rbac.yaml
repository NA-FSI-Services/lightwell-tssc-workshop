{{- if .Values.renovate.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.cronJob.serviceAccountName }}
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: renovate
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tokenJob.serviceAccountName }}
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tokenJob.serviceAccountName }}
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.bot.tokenSecretName | quote }}]
    verbs: ["get", "list", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tokenJob.serviceAccountName }}
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tokenJob.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tokenJob.serviceAccountName }}
    namespace: {{ .Values.renovate.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tokenJob.serviceAccountName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.gitea.adminSecretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tokenJob.serviceAccountName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tokenJob.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tokenJob.serviceAccountName }}
    namespace: {{ .Values.renovate.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tokenJob.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-setup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tokenJob.serviceAccountName }}
    namespace: {{ .Values.renovate.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.cronJob.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.renovate.namespace }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
    app.kubernetes.io/component: renovate
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.renovate.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.cronJob.serviceAccountName }}
    namespace: {{ .Values.renovate.namespace }}
{{- end }}
