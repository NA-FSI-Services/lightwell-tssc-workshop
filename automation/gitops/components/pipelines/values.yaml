# OpenShift Pipelines — Lightwell TSSC workshop
# Required before RHACS Tasks / student .tekton PipelineRuns (Module 5).
# Root App-of-Apps injects pipelines.* (see automation/bootstrap-infra).

pipelines:
  # Chart-level gate (root-app Application only exists when components.pipelines.enabled)
  enabled: true
  syncWaves:
    operator: "1"
    tasks: "2"
    userinfo: "3"

# V2-14: Task is in-cluster; seeded learner pipeline does NOT reference it.
verifyBaseImage:
  enabled: true
  namespace: lightwell-tasks
  taskName: verify-base-image
  # Same image as learner sign step. Pull uses the PipelineRun SA (lab ns).
  cosignImage: registry.redhat.io/rhtas/cosign-rhel9:1.3.0
  # Do not invent Hummingbird signer strings. Learner passes real identity in pipeline params.
  certificateIdentityRegexp: "REPLACE_ME_HUMMINGBIRD_IDENTITY"
  certificateOidcIssuer: "REPLACE_ME_HUMMINGBIRD_OIDC_ISSUER"
  attestationType: slsaprovenance
  insecureSkipTlog: "true"

# V2-15: Task + too-permissive policy ConfigMap; seeded pipeline does NOT reference it.
conformaPolicy:
  enabled: true
  namespace: lightwell-tasks
  taskName: conforma-policy
  configMapName: conforma-policy
  labNamespace: lw-poc-build
  # RHTAS 1.3 ships ec as 0.7 (not :1.3.0 — that tag does not exist). Pull uses the PipelineRun SA (lab ns).
  # v0.7.197 has no --skip-att-sig-check; --ignore-rekor breaks Fulcio cert timestamps.
  ecImage: registry.redhat.io/rhtas/ec-rhel9:0.7
  oseCliImage: registry.redhat.io/openshift4/ose-cli:latest
  cosignImage: registry.redhat.io/rhtas/cosign-rhel9:1.3.0
  # Seed is too permissive. Learner copies the ConfigMap to the lab ns and tightens.
  skipImageSigCheck: "true"
  skipAttSigCheck: "true"
  certificateIdentityRegexp: ".*"
  certificateOidcIssuerRegexp: ".*"
  ignoreRekor: "false"
  restrictMaxCveScore: 999

# V2-23: Maven prefetch Task (Konflux Hermeto analogue). Seeded pipeline does NOT reference it.
prefetchDependencies:
  enabled: true
  namespace: lightwell-tasks
  taskName: prefetch-dependencies
  mavenImage: registry.access.redhat.com/ubi9/openjdk-21:1.21
  pomPath: pom.xml
  settingsPath: settings.xml
  prefetchDir: .m2-offline
  mavenProfile: lightwell-remediated

# OLM install into openshift-operators (AllNamespaces; OperatorGroup already exists)
operator:
  enabled: true
  # Subscription metadata.name
  name: openshift-pipelines-operator
  # OLM package name
  packageName: openshift-pipelines-operator-rh
  namespace: openshift-operators
  channel: latest
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # openshift-operators already has an OperatorGroup — do not create another
  createOperatorGroup: false

# RHDP userinfo ConfigMap (optional orientation for operators / lab authors)
userInfo:
  enabled: true
  title: "Lightwell TSSC Workshop — OpenShift Pipelines"
  instructions: >-
    OpenShift Pipelines provides Tekton CRDs (Pipeline, Task, PipelineRun) used by
    Module 5 student .tekton overlays and RHACS policy-gate Tasks in stackrox.
    After the Operator is Ready, confirm: oc get crd pipelines.tekton.dev.
    Task verify-base-image lives in lightwell-tasks (V2-14). It is not in the
    seeded spring-boot-lw-poc-build-sign pipeline — wire it before openshift-build.
    Task conforma-policy and ConfigMap conforma-policy live in lightwell-tasks
    (V2-15). The seed is too permissive (skip signature checks, CVE 999). Copy
    the ConfigMap to the lab namespace, tighten it, and wire the Task after
    cosign-sign-keyless. Task prefetch-dependencies lives in lightwell-tasks
    (V2-23). It is not Hermeto and is not in the seeded pipeline — wire it
    before openshift-build after stripping public Central from settings.xml.
    Do not copy example-pipeline-snippet.yaml.

deployer:
  domain: ""
  apiUrl: ""
