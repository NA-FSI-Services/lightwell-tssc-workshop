{{- if .Values.validateJobs.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.validateJobs.namespace }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: validate
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.namespace | quote }}
{{- end }}
