{{- if .Values.validateJobs.enabled }}
---
# Worked examples are not paste-identical (wrong Job name, fake report).
apiVersion: v1
kind: ConfigMap
metadata:
  name: validate-docs
  namespace: {{ .Values.validateJobs.namespace }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.userinfo | quote }}
data:
  README: |
    V2-51 scaffold. One Validate Job per gated module (1.1–7.2). Intro has none.

    Create the Job from ConfigMap {{ .Values.templatesConfigMap }} — do not
    apply example-validate-job.yaml (wrong name). Fill report-<id>-<slug> in
    {{ .Values.validateJobs.namespace }}; do not copy example-report.yaml.

    Jobs are idempotent and must finish under 60s. Unlimited retries: delete
    the Job, then oc create again. There is no Solve. Showroom does not lock
    the next URL (honor system). Stubs fail until V2-54 fills cluster/git
    checks. Report quiz keys are V2-59.

    Do not add runtime-automation/. Do not bake a pass path into provision.
  example-report.yaml: |
    # Worked example ONLY — different name and keys.
    # Pasting this into report-01-hummingbird-verify still fails the Check.
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: report-example-not-scored
      namespace: example-validate
    data:
      essay: this is not a quiz key
      status: copied-from-docs
  example-validate-job.yaml: |
    # Worked example ONLY — different Job name.
    # oc create of this file is not a gated Check.
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: example-validate-not-scored
      namespace: example-validate
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command: ["false"]
{{- end }}
