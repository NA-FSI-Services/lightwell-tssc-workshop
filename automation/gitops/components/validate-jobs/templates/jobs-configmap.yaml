{{- if .Values.validateJobs.enabled }}
---
# Learner-started Job YAML (same pattern as oc-mirror). Provision does not
# create Job instances — Argo would fight delete+create retries.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.templatesConfigMap }}
  namespace: {{ .Values.validateJobs.namespace }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: job-templates
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.jobs | quote }}
data:
{{- range .Values.modules }}
  job-{{ .id }}.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ include "validate-jobs.jobName" . }}
      namespace: {{ $.Values.validateJobs.namespace }}
      labels:
        app.kubernetes.io/name: validate-jobs
        app.kubernetes.io/component: validate
        tssc.workshop/module: {{ .id | quote }}
    spec:
      backoffLimit: {{ $.Values.job.backoffLimit }}
      activeDeadlineSeconds: {{ .activeDeadlineSeconds | default $.Values.job.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $.Values.job.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: validate-jobs
            app.kubernetes.io/component: validate
            tssc.workshop/module: {{ .id | quote }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $.Values.job.serviceAccountName }}
{{ if .withCosign }}
          initContainers:
            - name: copy-cosign
              image: {{ $.Values.job.cosignImage | quote }}
              imagePullPolicy: {{ $.Values.job.imagePullPolicy | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  dest="/opt/cosign/cosign"
                  for c in "/usr/bin/cosign" "/usr/local/bin/cosign"; do
                    if [ -x "$c" ]; then
                      cp -a "$c" "$dest"
                      chmod 0755 "$dest"
                      ls -l "$dest"
                      exit 0
                    fi
                  done
                  src="$(command -v cosign 2>/dev/null || true)"
                  if [ -n "$src" ] && [ -x "$src" ]; then
                    cp -a "$src" "$dest"
                    chmod 0755 "$dest"
                    ls -l "$dest"
                    exit 0
                  fi
                  echo "ERROR: cosign not found in image" >&2
                  exit 1
              volumeMounts:
                - name: cosign-bin
                  mountPath: /opt/cosign
              resources:
                requests:
                  cpu: {{ $.Values.job.resources.requests.cpu | quote }}
                  memory: {{ $.Values.job.resources.requests.memory | quote }}
                limits:
                  cpu: {{ $.Values.job.resources.limits.cpu | quote }}
                  memory: {{ $.Values.job.resources.limits.memory | quote }}
{{ end }}
          containers:
            - name: check
              image: {{ $.Values.job.image | quote }}
              imagePullPolicy: {{ $.Values.job.imagePullPolicy | quote }}
              env:
                - name: VALIDATE_NS
                  value: {{ $.Values.validateJobs.namespace | quote }}
                - name: MODULE_ID
                  value: {{ .id | quote }}
                - name: MODULE_TITLE
                  value: {{ .title | quote }}
                - name: REPORT_NAME
                  value: {{ include "validate-jobs.reportName" . | quote }}
              command:
                - /bin/bash
                - -ec
                - source /opt/validate/helper.sh && bash /opt/validate/check.sh
              volumeMounts:
                - name: scripts
                  mountPath: /opt/validate
                  readOnly: true
{{ if .withCosign }}
                - name: cosign-bin
                  mountPath: /opt/cosign
{{ end }}
              resources:
                requests:
                  cpu: {{ if .withCosign }}{{ $.Values.job.cosignResources.requests.cpu | quote }}{{ else }}{{ $.Values.job.resources.requests.cpu | quote }}{{ end }}
                  memory: {{ if .withCosign }}{{ $.Values.job.cosignResources.requests.memory | quote }}{{ else }}{{ $.Values.job.resources.requests.memory | quote }}{{ end }}
                limits:
                  cpu: {{ if .withCosign }}{{ $.Values.job.cosignResources.limits.cpu | quote }}{{ else }}{{ $.Values.job.resources.limits.cpu | quote }}{{ end }}
                  memory: {{ if .withCosign }}{{ $.Values.job.cosignResources.limits.memory | quote }}{{ else }}{{ $.Values.job.resources.limits.memory | quote }}{{ end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ $.Values.scriptsConfigMap }}
                defaultMode: 0755
{{ if .withCosign }}
            - name: cosign-bin
              emptyDir: {}
{{ end }}
{{- end }}
{{- end }}
