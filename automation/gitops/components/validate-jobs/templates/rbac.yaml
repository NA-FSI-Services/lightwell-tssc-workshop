{{- if .Values.validateJobs.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.job.serviceAccountName }}
  namespace: {{ .Values.validateJobs.namespace }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: validate
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.rbac | quote }}
---
# Read-only. Learners start Jobs with the Showroom SA (cluster-admin). This SA
# only inspects cluster/git state inside the Job. No secrets. No Solve.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.job.clusterRoleName }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: validate
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "namespaces", "pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list"]
  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "pipelineruns", "tasks", "taskruns"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["imagepolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.job.clusterRoleName }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: validate
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.job.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.job.serviceAccountName }}
    namespace: {{ .Values.validateJobs.namespace }}
{{- end }}
