{{- if and .Values.validateJobs.enabled .Values.userInfo.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-userinfo-validate
  namespace: {{ .Values.validateJobs.namespace }}
  labels:
    {{- include "validate-jobs.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.validateJobs.syncWaves.userinfo | quote }}
data:
  demo_title: {{ .Values.userInfo.title | quote }}
  access_instructions: {{ .Values.userInfo.instructions | quote }}
  deployment_type: helm
  validate_namespace: {{ .Values.validateJobs.namespace | quote }}
  scripts_configmap: {{ .Values.scriptsConfigMap | quote }}
  templates_configmap: {{ .Values.templatesConfigMap | quote }}
  service_account: {{ .Values.job.serviceAccountName | quote }}
  honor_system: "true"
  solve: "false"
  runtime_automation: "false"
  live_state: V2-54
  report_schema: V2-59
  gated_module_count: {{ .Values.modules | len | quote }}
  rerun_example: |
    oc -n {{ .Values.validateJobs.namespace }} delete job {{ include "validate-jobs.jobName" (index .Values.modules 0) }} --ignore-not-found
    oc -n {{ .Values.validateJobs.namespace }} get configmap {{ .Values.templatesConfigMap }} \
      -o go-template='{{ "{{ index .data \"job-01.yaml\" }}" }}' | oc create -f -
    oc -n {{ .Values.validateJobs.namespace }} logs -f job/{{ include "validate-jobs.jobName" (index .Values.modules 0) }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- range .Values.modules }}
  module_{{ .id }}_job: {{ include "validate-jobs.jobName" . | quote }}
  module_{{ .id }}_report: {{ include "validate-jobs.reportName" . | quote }}
{{- end }}
{{- end }}
