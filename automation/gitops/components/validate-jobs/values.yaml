# V2-51 — scaffold in-cluster Validate Jobs + shared helper.
# Classic Showroom. No runtime-automation/. No Solve. Track checks are V2-54.
# Report quiz keys/tokens are V2-59. These seeds only have status: REPLACE_ME.

validateJobs:
  enabled: true
  namespace: lw-poc-validate
  syncWaves:
    namespace: "0"
    rbac: "1"
    scripts: "1"
    reports: "2"
    jobs: "2"
    userinfo: "3"

job:
  serviceAccountName: validate-jobs
  clusterRoleName: validate-jobs
  image: registry.redhat.io/openshift4/ose-cli:latest
  imagePullPolicy: IfNotPresent
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

scriptsConfigMap: validate-scripts
templatesConfigMap: validate-job-templates

# One Job + one report ConfigMap per gated module (intro is ungated).
# jobName / reportName = validate-|report-{{ id }}-{{ slug }}
modules:
  - id: "01"
    slug: hummingbird-verify
    title: "1.1 Verify Hummingbird"
  - id: "02"
    slug: hummingbird-mirror
    title: "1.2 Mirror into the trust boundary"
  - id: "03"
    slug: enterprise-proxy
    title: "2.1 Enterprise proxy"
  - id: "04"
    slug: remediated-pin
    title: "2.2 Remediated pin"
  - id: "05"
    slug: golden-path-source
    title: "3.1 Golden-path source"
  - id: "06"
    slug: bind-base-deps
    title: "3.2 Bind base + deps in source"
  - id: "07"
    slug: live-renovate
    title: "3.3 Live Renovate"
  - id: "08"
    slug: forbid-list
    title: "4.1 Source forbid-list"
  - id: "09"
    slug: prefetch
    title: "4.2 Prefetch (Hermeto mapping)"
  - id: "10"
    slug: build-networkpolicy
    title: "4.3 Build NetworkPolicy"
  - id: "11"
    slug: build-sbom
    title: "4.4 Build + SBOM"
  - id: "12"
    slug: sign-keyless
    title: "5.1 Sign (keyless)"
  - id: "13"
    slug: attest-conforma
    title: "5.2 Attest + Conforma"
  - id: "14"
    slug: disconnected-verify
    title: "5.3 Disconnected verify"
  - id: "15"
