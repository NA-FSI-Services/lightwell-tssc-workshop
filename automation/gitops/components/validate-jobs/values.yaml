# V2-59 — live-state Validate Jobs plus per-module report tokens. No Solve.
# Seeds stay incomplete so a fresh claim fails.

validateJobs:
  enabled: true
  namespace: lw-poc-validate
  syncWaves:
    namespace: "0"
    rbac: "1"
    scripts: "1"
    reports: "2"
    jobs: "2"
    userinfo: "3"

job:
  serviceAccountName: validate-jobs
  clusterRoleName: validate-jobs
  image: registry.redhat.io/openshift4/ose-cli:latest
  imagePullPolicy: IfNotPresent
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

scriptsConfigMap: validate-scripts
templatesConfigMap: validate-job-templates

# One Job + one report ConfigMap per gated module (intro is ungated).
# jobName / reportName = validate-|report-{{ id }}-{{ slug }}
# quiz.key is unique per module; seed REPLACE_ME; allowed tokens live in check-NN.sh.
