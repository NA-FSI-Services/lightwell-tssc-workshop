userInfo:
  enabled: true
  title: "Lightwell TSSC Workshop — Validate Jobs"
  instructions: >-
    Each gated module has a learner-started Job in lw-poc-validate. Delete the
    Job if it already exists, create it from validate-job-templates, then read
    logs. Jobs are idempotent, under 60s, unlimited retries. There is no Solve.
    Jobs grade cluster/git state and the report ConfigMap token for that
    module. Do not copy validate-docs. Honor system: URLs still work if you skip.

deployer:
  domain: ""
  apiUrl: ""
