{{- if and .Values.showroom.enabled .Values.userInfo.enabled }}
---
# RHDP access links — showroom_url for claim email / portal (field-content pattern)
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-userinfo-showroom
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.userinfo | quote }}
data:
  demo_title: {{ .Values.userInfo.title | quote }}
  access_instructions: {{ .Values.userInfo.instructions | quote }}
  deployment_type: "helm"
  showroom_url: {{ include "showroom.url" . | quote }}
  showroom_namespace: {{ .Values.showroom.namespace | quote }}
  antora_playbook: {{ .Values.showroom.content.antoraPlaybook | quote }}
  content_repo: {{ .Values.showroom.content.repoUrl | quote }}
  content_ref: {{ .Values.showroom.content.repoRef | quote }}
  terminal_enabled: {{ .Values.showroom.terminal.enabled | quote }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
  gitea_url: {{ include "showroom.giteaUrl" . | quote }}
  hummingbird_source_pullspec: {{ .Values.lab.hummingbirdSourcePullSpec | quote }}
  hummingbird_amd64_manifest: {{ .Values.lab.hummingbirdAmd64Manifest | quote }}
  hummingbird_source_registry: {{ .Values.lab.hummingbirdSourceRegistry | quote }}
  dest_registry_host: {{ include "showroom.destRegistryHost" . | quote }}
  dest_registry_url: {{ include "showroom.destRegistryUrl" . | quote }}
  dest_registry_docker: {{ printf "docker://%s" (include "showroom.destRegistryHost" .) | quote }}
  dest_registry_repo: {{ .Values.lab.destRegistryRepo | quote }}
  lab_clis: {{ include "showroom.labClis" . | quote }}
  syft_baked: "false"
  do_not_curl_github: "true"
  lab_entry: "Open showroom_url → split-screen seven-track guide + Terminal; RHTPA embeds; SSO/Nexus/Console open externally (ui-config.yml); direct /terminal/ also works"
{{- end }}
