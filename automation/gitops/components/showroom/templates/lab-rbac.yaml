{{- if and .Values.showroom.enabled .Values.showroom.terminal.enabled .Values.showroom.terminal.labClusterAccess }}
---
# Showroom terminal uses this SA for in-pod `oc`. Modules 1–5 read/create across
# lightwell-repo, RHTPA, RHACS, RHTAS, GitOps, etc. Namespace-local `edit` is not enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.showroom.name }}-lab-cluster-admin
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.config | quote }}
    lightwell.redhat.com/purpose: "Showroom terminal SA cross-namespace lab access (Modules 1–5)"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
{{- end }}
