# Showroom — RHDP split-screen lab guide + terminal (issue #19)
# Content: site.yml → docs/modules/ROOT (Modules 1–6). Images per docs/SHOWROOM-UPDATE-SPEC.md.
showroom:
  enabled: true
  namespace: showroom
  name: showroom

  syncWaves:
    namespace: "0"
    config: "1"
    workload: "2"
    route: "3"
    userinfo: "4"

  content:
    repoUrl: "https://github.com/rhpds/lightwell-tssc-workshop.git"
    repoRef: "main"
    antoraPlaybook: "site.yml"
    image: "quay.io/rhpds/showroom-content:v1.3.1"
    gitClonerImage: "quay.io/rhpds/git-cloner:v1.1.2"
    antoraImage: "quay.io/rhpds/antora:v1.0.1"
    nginxImage: "quay.io/rhpds/nginx:1.25"

  # ZT UI shell reads repo-root ui-config.yml for split-screen (lab + /terminal/).
  # LlamaStack / multi-user zero-touch automation remain out of scope (UPDATE-SPEC).
  nookbag:
    enabled: true
    bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip"

  terminal:
    enabled: true
    image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
    # ClusterRoleBinding → cluster-admin for the Showroom SA so Module 1–5
    # `oc -n lightwell-repo|stackrox|…` commands work from /terminal/.
    # Required for Field Content / RHDP catalog (namespace-local edit is not enough).
    labClusterAccess: true
    # V2-20: copy CLIs from already-pinned registry.redhat.io images (no github.com).
    # syft has no Red Hat CLI image — deferred until a bake registry exists.
    tools:
      enabled: true
      mountDir: /usr/local/bin
      items:
        - name: cosign
          image: registry.redhat.io/rhtas/cosign-rhel9:1.3.0
        - name: ec
          image: registry.redhat.io/rhtas/ec-rhel9:0.7
        - name: oc-mirror
          image: registry.redhat.io/openshift4/oc-mirror-plugin-rhel9:v4.20
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  pvc:
    size: 5Gi

# Discovery for Showroom userinfo (must match V2-1 pin + gitea / lightwell-repo charts)
lab:
  giteaHostPrefix: gitea
  lightwellRepoNamespace: lightwell-repo
  destRegistryRepo: hummingbird-mirror
  hummingbirdSourcePullSpec: "registry.access.redhat.com/hi/openjdk:21-runtime@sha256:e7c41dc2cba28c49d551c491419e00b75c5aef6c13326cc08765d30e882630ba"
  hummingbirdAmd64Manifest: "sha256:dd3ce6562cc9bd752c5c1424b740397cbf8ca08c036d50311acfa19c756cdf37"
  hummingbirdSourceRegistry: "registry.access.redhat.com"

# Injected by root-app / field-content
deployer:
  domain: ""
  apiUrl: ""

# Antora userdata attributes (optional context for lab prose)
demo:
  namespace: spring-boot-lw-poc
  appName: spring-boot-lw-poc

userInfo:
  enabled: true
  title: "Lightwell Software Supply Chain Security Workshop"
  instructions: >-
    Open Showroom for the seven-track TSSC lab (split-screen guide + terminal).
    Use the terminal pane for oc / tkn / mvn / cosign / ec / oc-mirror.
    syft is not baked yet (no Red Hat CLI image). Never curl github.com for CLIs.
    Never commit LW_USERNAME / LW_PASSWORD.
