{{- if and .Values.rhtpa.enabled .Values.ingestionInfo.enabled }}
{{- $serverUrl := include "rhtpa.serverUrl" . }}
---
# Lab-facing notes for CycloneDX SBOM + VEX / advisory ingestion (Module 4 / #17, RHDA #26).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhtpa-ingestion-info
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhtpa.syncWaves.userinfo | quote }}
data:
  server_url: {{ $serverUrl | quote }}
  supported_cyclonedx_version: {{ .Values.ingestionInfo.supportedCycloneDxVersion | quote }}
  sbom_formats: "CycloneDX JSON (preferred for workshop syft output)"
  vex_advisory_formats: "OpenVEX + CycloneDX vulnerabilities[] bound to the Track 2 Lightwell GAV; optional CVE list v5 / OSV importers (not the Check)"
  scored_source: {{ .Values.ingestionInfo.scoredSource | quote }}
  scored_vex_id: {{ .Values.ingestionInfo.scoredVexId | quote }}
  scored_vex_gav: {{ .Values.ingestionInfo.scoredVexGav | quote }}
  live_csaf_gate: {{ .Values.ingestionInfo.liveCsafGate | quote }}
  upload_hint: >-
    Track 7 Check: pull CDX+VEX for {{ .Values.ingestionInfo.scoredVexGav }} from Nexus
    (Maven classifiers cdx/vex, or the raw OSV GAV paths), then upload via the TPA UI
    or REST API authenticated with the cli OIDC client. Do not enable the redhat-csaf
    importer as the Check. Provision does not pre-ingest these files into TPA.
  importers: >-
    Enabled by default: cve (CVE list v5), osv-github (OSV advisories).
    Disabled and not the Track 7 gate: redhat-csaf, redhat-sboms.
    Scored VEX is the Lightwell GAV seed in Nexus ({{ .Values.ingestionInfo.scoredVexId }}),
    ingested by the learner — not a live CSAF feed.
  os_layer_callout: >-
    Hummingbird / Red Hat CSAF is OS-layer VEX (layer map only). Python SPDX/VEX
    analogue is Track 8 text — no second GAV seed.
  rhda_note: >-
    RHDA (IDE) is the shift-left client; RHTPA is the SBOM system of record.
    Showroom uses TPA UI + syft only — no IDE in-cluster. Instructors may demo
    RHDA on a laptop (Backend URL → public rhda.rhcloud.com or workshop Exhort route).
    See docs/rhda-rhtpa-shift-left.md and Showroom page rhda-shift-left.adoc.
  rhda_doc: "docs/rhda-rhtpa-shift-left.md"
{{- end }}
