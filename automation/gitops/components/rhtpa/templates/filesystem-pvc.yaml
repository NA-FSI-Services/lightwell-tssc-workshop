{{- if and .Values.rhtpa.enabled (eq .Values.trustedProfileAnalyzer.storage.type "filesystem") }}
---
# Operator migrate-db / server mount claimName: storage. The CR size field does
# not create this PVC (#101). Wave 2 so it exists before the instance (wave 3).
# Pin an Immediate StorageClass so the PVC Binds without a first-consumer Job
# (default WaitForFirstConsumer + Argo waves deadlocked; bind Job then
# Multi-Attached after TTL). Claims without Immediate RBD: set storageClassName
# empty and storage.bindJob true.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: tpa-filesystem
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhtpa.syncWaves.database | quote }}
    argocd.argoproj.io/sync-options: DisableHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
{{- with .Values.trustedProfileAnalyzer.storage.storageClassName }}
  storageClassName: {{ . | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.trustedProfileAnalyzer.storage.size | quote }}
{{- end }}
