{{- if .Values.admission.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tufCopy.serviceAccountName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tufCopy.serviceAccountName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tufCopy.serviceAccountName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tufCopy.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tufCopy.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tufCopy.serviceAccountName }}
  namespace: {{ .Values.rhtas.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  - apiGroups: ["rhtas.redhat.com"]
    resources: ["securesigns"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tufCopy.serviceAccountName }}
  namespace: {{ .Values.rhtas.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tufCopy.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tufCopy.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tufCopy.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tufCopy.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["config.openshift.io"]
    resources: ["imagepolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.apply.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.apply.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.apply.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.apply.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.apply.serviceAccountName }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.apply.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.apply.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.apply.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: trust-policy-apply
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.rbac | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.apply.serviceAccountName }}
    namespace: {{ .Values.admission.namespace }}
{{- end }}
