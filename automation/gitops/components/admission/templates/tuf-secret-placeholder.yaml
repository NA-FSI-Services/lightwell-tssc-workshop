{{- if and .Values.admission.enabled .Values.tufCopy.enabled }}
---
# Filled by Job rhtas-tuf-copy after Securesign is Ready. Learners never paste PEMs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tufCopy.secretName }}
  namespace: {{ .Values.admission.namespace }}
  labels:
    {{- include "admission.labels" . | nindent 4 }}
    app.kubernetes.io/component: tuf-copy
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.admission.syncWaves.tufCopy | quote }}
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  placeholder: "rhtas-tuf-copy fills fulcio_v1.crt.pem and rekor.pub"
{{- end }}
