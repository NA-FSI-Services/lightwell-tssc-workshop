# Red Hat Advanced Cluster Security — Lightwell TSSC workshop
# Patterns adapted from RHACS demo / StackRox Operator install docs.
# Root App-of-Apps injects rhacs.* and deployer.* (see automation/bootstrap-infra).

rhacs:
  enabled: true
  # Central / SecuredCluster namespace (RHACS recommends stackrox)
  namespace: stackrox
  apiVersion: platform.stackrox.io/v1alpha1
  syncWaves:
    namespace: "0"
    operator: "1"
    central: "2"
    securedCluster: "3"
    pipeline: "4"
    ciToken: "5"
    userinfo: "6"

# OLM install — RHACS Operator in dedicated rhacs-operator namespace
operator:
  enabled: true
  name: rhacs-operator
  packageName: rhacs-operator
  namespace: rhacs-operator
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  createOperatorGroup: true

# Central CR (management plane + Scanner)
central:
  enabled: true
  name: stackrox-central-services
  exposure:
    route: true
  # Workshop-sized PVC defaults (raise for long-lived / large CVE DBs)
  persistence:
    pvcSize: 50Gi
  db:
    pvcSize: 50Gi
  scanner:
    # Scanner V4 preferred on recent RHACS; analyzer scaling kept modest for CNV
    replicas: 2
    autoScaling: Disabled
  egress:
    # Online pulls vulnerability feeds; Offline for air-gapped (not default here)
    connectivityPolicy: Online

# Same-cluster SecuredCluster (Sensor / Collector / Admission)
securedCluster:
  enabled: true
  name: stackrox-secured-cluster-services
  clusterName: lightwell-tssc-workshop
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    listenOnEvents: true

# Pipeline policy hooks — dep gate + roxctl image check + SBOM → RHTPA (#13)
pipelineHooks:
  enabled: true
  taskName: acs-image-check
  # Secret keys expected by the Task (create after Central is Ready — do not commit tokens)
  #   rox-api-endpoint: central-stackrox.apps.<domain>:443
  #   rox-api-token: <CI API token from Central>
  secretName: rhacs-ci-secrets
  createSecretPlaceholder: true
  # After Central Ready, Job mints Continuous Integration token into secretName (idempotent).
  ciTokenJob:
    enabled: true
    jobName: rhacs-ci-token-mint
    serviceAccountName: rhacs-ci-token
    image: registry.access.redhat.com/ubi9/ubi:latest
    imagePullPolicy: IfNotPresent
    tokenName: lightwell-ci
    role: Continuous Integration
    waitSeconds: "600"
    backoffLimit: 6
    ttlSecondsAfterFinished: 86400
  insecureSkipTlsVerify: "true"
  # When true, acs-image-check fails if CI secrets are missing (strict workshop runs)
  failOnSkipped: "false"
  exampleImage: "quay.io/redhatdemo/lightwell-placeholder:latest"
  depGate:
    enabled: true
    taskName: lightwell-dep-gate
    defaultMode: require-remediated
    watchedArtifact: commons-lang3
    vulnerableVersion: "3.14.0"
    remediatedVersion: "3.14.0.rhlw-00001"
  # Python twin (#149) — Module 9 fail/pass on requirements.txt lw-workshop-pypi pin
  pythonDepGate:
    enabled: true
    taskName: lightwell-python-dep-gate
    defaultMode: require-remediated
    watchedPackage: lw-workshop-pypi
    # Fail path: pin absent from default fastapi-lw-poc requirements.txt
    vulnerableVersion: ""
    remediatedVersion: "1.0.0+rhlw.00001"
  sbom:
    enabled: true
    taskName: syft-sbom-rhtpa
    # Distroless — used only via ENTRYPOINT/args (no Tekton script:)
    syftImage: "ghcr.io/anchore/syft:v1.18.1"
    # Shell + curl for results / optional RHTPA upload
    uploadImage: "registry.access.redhat.com/ubi9/ubi-minimal:latest"
    # Set to https://<rhtpa-route> when RHTPA is synced; empty = write SBOM for UI upload
    rhtpaUrl: ""
    rhtpaSecretName: rhtpa-upload-token

  # Student-facing git (in-cluster Gitea). Prefer root-app injection when
  # components.gitea.enabled — never point learners at the workshop GitOps monorepo.
  labRepoUrl: ""
  labRevision: main
  # When labRepoUrl is empty, Module 5 discovers URL from demo-userinfo-gitea.
  # Fallback host pattern used only for ConfigMap examples when deployer.domain is set.
  labRepoHostPrefix: gitea
  labRepoOwner: student
  labRepoName: spring-boot-lw-poc
  # Optional override for Python policy lab ConfigMap examples (#149).
  labPythonRepoUrl: ""

  pipeline:
    enabled: true
    name: lightwell-build-policy-gate
    # Student repos seed pom.xml at repository root (not the monorepo path).
    defaultPomPath: pom.xml
  pythonPipeline:
    enabled: true
    name: lightwell-python-build-policy-gate
    # Student FastAPI repos seed requirements.txt at repository root.
    defaultRequirementsPath: requirements.txt
  centralPolicy:
    enabled: true

# RHDP userinfo ConfigMap
userInfo:
  enabled: true
  title: "Lightwell TSSC Workshop — Advanced Cluster Security"
  instructions: >-
    Open RHACS Central (stackrox). Import the Fixable Critical BUILD policy.
    Secret rhacs-ci-secrets is filled by Job rhacs-ci-token-mint (or
    ./scripts/dev-cluster-rhacs-ci-token.sh). Run Pipeline lightwell-build-policy-gate:
    fail on non-remediated Maven pins, pass after .rhlw-* update, then SBOM → RHTPA.
    Python Modules 8–9: Pipeline lightwell-python-build-policy-gate fails until
    requirements.txt pins lw-workshop-pypi==1.0.0+rhlw.00001.

# Injected by root-app / field content workload
deployer:
  domain: ""
  apiUrl: ""
