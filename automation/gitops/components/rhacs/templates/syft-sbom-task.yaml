{{- if and .Values.rhacs.enabled .Values.pipelineHooks.enabled .Values.pipelineHooks.sbom.enabled }}
---
# Generate CycloneDX SBOM (syft) and optionally POST to RHTPA for attestation visibility.
#
# ghcr.io/anchore/syft is distroless (no shell) — Tekton `script:` cannot execute there.
# Generation steps use the image ENTRYPOINT + args; publish uses UBI for results + curl.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: {{ .Values.pipelineHooks.sbom.taskName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline-hooks
    lightwell.redhat.com/gate: sbom-rhtpa
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.pipeline | quote }}
spec:
  description: >-
    Produce a CycloneDX SBOM with syft and upload to RHTPA when endpoint/token
    are provided (Module 4 / 5 — SBOM attestations in Trusted Profile Analyzer).
  params:
    - name: image
      type: string
      default: ""
      description: Container image to scan (preferred). If empty, scans workspace directory.
    - name: source-path
      type: string
      default: .
    - name: rhtpa-url
      type: string
      default: {{ .Values.pipelineHooks.sbom.rhtpaUrl | quote }}
      description: RHTPA base URL (https://...). Empty skips upload but still writes SBOM.
    - name: rhtpa-secret-name
      type: string
      default: {{ .Values.pipelineHooks.sbom.rhtpaSecretName | quote }}
      description: Optional Secret with key token for RHTPA API auth
    - name: fail-on-upload-error
      type: string
      default: "false"
  workspaces:
    - name: source
      optional: true
    - name: sbom
      description: Output workspace for CycloneDX JSON
  results:
    - name: sbom-path
      type: string
    - name: upload-status
      type: string
  volumes:
    - name: rhtpa-secret
      secret:
        secretName: $(params.rhtpa-secret-name)
        optional: true
  steps:
    - name: syft-image
      computeResources: {}
      image: {{ .Values.pipelineHooks.sbom.syftImage | quote }}
      workingDir: /workspace
      when:
        - input: "$(params.image)"
          operator: notin
          values: [""]
      args:
        - packages
        - $(params.image)
        - -o
        - cyclonedx-json=$(workspaces.sbom.path)/sbom.cyclonedx.json

    - name: syft-dir
      computeResources: {}
      image: {{ .Values.pipelineHooks.sbom.syftImage | quote }}
      workingDir: /workspace
      when:
        - input: "$(params.image)"
          operator: in
          values: [""]
      args:
        - packages
        - dir:$(workspaces.source.path)/$(params.source-path)
        - -o
        - cyclonedx-json=$(workspaces.sbom.path)/sbom.cyclonedx.json

    - name: publish-sbom
      computeResources: {}
      image: {{ .Values.pipelineHooks.sbom.uploadImage | quote }}
      workingDir: /workspace
      volumeMounts:
        - name: rhtpa-secret
          mountPath: /rhtpa-secret
      env:
        - name: PARAM_RHTPA_URL
          value: $(params.rhtpa-url)
        - name: FAIL_ON_UPLOAD
          value: $(params.fail-on-upload-error)
        - name: SBOM_DIR
          value: $(workspaces.sbom.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        OUT="${SBOM_DIR}/sbom.cyclonedx.json"
        if [[ ! -f "${OUT}" ]]; then
          echo "ERROR: ${OUT} missing — syft step did not write CycloneDX"
          echo -n "failed" > "$(results.upload-status.path)"
          echo -n "missing" > "$(results.sbom-path.path)"
          exit 1
        fi
        echo -n "${OUT}" > "$(results.sbom-path.path)"
        ls -la "${OUT}"
        # Quick sanity (jq may be absent on minimal UBI)
        head -c 200 "${OUT}"; echo

        if [[ -z "${PARAM_RHTPA_URL}" ]]; then
          echo "RHTPA URL empty — SBOM written for manual UI/API upload"
          echo -n "skipped-no-url" > "$(results.upload-status.path)"
          exit 0
        fi

        if ! command -v curl >/dev/null 2>&1; then
          microdnf install -y curl >/dev/null
        fi

        TOKEN=""
        if [[ -s /rhtpa-secret/token ]]; then
          TOKEN="$(cat /rhtpa-secret/token)"
        fi

        # Trustify 3 / RHTPA: POST /api/v3/sbom (application/octet-stream).
        # Fall back to legacy /api/v2/sbom JSON for older bombastic-style endpoints.
        set +e
        status=1
        for UPLOAD_URL in \
          "${PARAM_RHTPA_URL%/}/api/v3/sbom" \
          "${PARAM_RHTPA_URL%/}/api/v2/sbom"
        do
          echo "Attempting SBOM upload to ${UPLOAD_URL}"
          if [[ "${UPLOAD_URL}" == *"/api/v3/"* ]]; then
            CT="application/octet-stream"
          else
            CT="application/json"
          fi
          if [[ -n "${TOKEN}" ]]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: ${CT}" \
              --data-binary @"${OUT}" \
              "${UPLOAD_URL}"
            status=$?
          else
            curl -sS -f -X POST \
              -H "Content-Type: ${CT}" \
              --data-binary @"${OUT}" \
              "${UPLOAD_URL}"
            status=$?
          fi
          if [[ "${status}" -eq 0 ]]; then
            break
          fi
        done
        set -e
        if [[ "${status}" -eq 0 ]]; then
          echo -n "uploaded" > "$(results.upload-status.path)"
          echo "SBOM attestation submitted to RHTPA"
          exit 0
        fi
        echo "WARN: automated upload failed (HTTP/curl ${status}). SBOM is in the sbom workspace — upload via RHTPA UI."
        echo -n "manual-required" > "$(results.upload-status.path)"
        if [[ "${FAIL_ON_UPLOAD}" == "true" ]]; then
          exit 1
        fi
        exit 0
    - name: persist-sbom
      computeResources: {}
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: SBOM_DIR
          value: $(workspaces.sbom.path)
        - name: PERSIST_CM
          value: lab-sbom-cyclonedx
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        OUT="${SBOM_DIR}/sbom.cyclonedx.json"
        if [[ ! -f "${OUT}" ]]; then
          echo "WARN: ${OUT} missing — skip persist"
          exit 0
        fi
        oc delete configmap "${PERSIST_CM}" --ignore-not-found
        oc create configmap "${PERSIST_CM}" \
          --from-file=sbom.cyclonedx.json="${OUT}"
        echo "Persisted ConfigMap ${PERSIST_CM} for Track 7.1 (emptyDir does not survive pod completion)"
{{- end }}
