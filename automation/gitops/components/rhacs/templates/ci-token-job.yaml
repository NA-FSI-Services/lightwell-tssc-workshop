{{- if and .Values.rhacs.enabled .Values.pipelineHooks.enabled .Values.pipelineHooks.ciTokenJob.enabled }}
{{- $endpoint := include "rhacs.centralEndpoint" . }}
{{- $pipelineEndpoint := include "rhacs.centralInternalEndpoint" . }}
---
# Mint Central CI token, copy it into the learner build namespace (Tekton mounts
# secrets from the TaskRun ns), and register the internal registry so roxctl can
# enrich lw-poc-build images. Idempotent. Never commits tokens to Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.pipelineHooks.ciTokenJob.jobName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.ciToken | quote }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.pipelineHooks.ciTokenJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.pipelineHooks.ciTokenJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "rhacs.labels" . | nindent 8 }}
        app.kubernetes.io/component: ci-token
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
      containers:
        - name: mint-ci-token
          image: {{ .Values.pipelineHooks.ciTokenJob.image | quote }}
          imagePullPolicy: {{ .Values.pipelineHooks.ciTokenJob.imagePullPolicy | quote }}
          env:
            - name: NAMESPACE
              value: {{ .Values.rhacs.namespace | quote }}
            - name: SECRET_NAME
              value: {{ .Values.pipelineHooks.secretName | quote }}
            - name: TOKEN_NAME
              value: {{ .Values.pipelineHooks.ciTokenJob.tokenName | quote }}
            - name: TOKEN_ROLE
              value: {{ .Values.pipelineHooks.ciTokenJob.role | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.pipelineHooks.ciTokenJob.waitSeconds | quote }}
            - name: FALLBACK_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: PIPELINE_ENDPOINT
              value: {{ $pipelineEndpoint | quote }}
            - name: BUILD_NAMESPACE
              value: {{ .Values.pipelineHooks.buildNamespace | quote }}
            - name: REGISTRY_INTEGRATION
              value: {{ .Values.pipelineHooks.registryIntegration.enabled | quote }}
            - name: REGISTRY_ENDPOINT
              value: {{ .Values.pipelineHooks.registryIntegration.endpoint | quote }}
            - name: INTEGRATION_NAME
              value: {{ .Values.pipelineHooks.registryIntegration.name | quote }}
            - name: PULLER_SA
              value: {{ .Values.pipelineHooks.registryIntegration.pullerSA | quote }}
          command:
            - /bin/bash
            - /scripts/mint-ci-token.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: rhacs-ci-token-scripts
            defaultMode: 0555
{{- end }}
