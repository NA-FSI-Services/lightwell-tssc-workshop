{{- if and .Values.rhacs.enabled .Values.pipelineHooks.enabled .Values.pipelineHooks.createSecretPlaceholder }}
{{- $endpoint := include "rhacs.centralEndpoint" . }}
---
# Placeholder for CI credentials used by Tekton Task acs-image-check.
# After Central is Ready, create an API token with CI permissions and patch this Secret:
#   oc -n {{ .Values.rhacs.namespace }} create secret generic {{ .Values.pipelineHooks.secretName }} \
#     --from-literal=rox-api-endpoint='{{ $endpoint }}' \
#     --from-literal=rox-api-token='<TOKEN>' --dry-run=client -o yaml | oc apply -f -
# Do not commit real tokens.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pipelineHooks.secretName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.pipeline | quote }}
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  rox-api-endpoint: {{ $endpoint | quote }}
  # Intentionally omit rox-api-token so Argo syncs do not wipe a patched CI token.
  # Filled by Job rhacs-ci-token-mint (or ./scripts/dev-cluster-rhacs-ci-token.sh).
  # Without a token, acs-image-check soft-skips (fail-on-skipped=false).
{{- if and .Values.pipelineHooks.buildNamespace (ne .Values.pipelineHooks.buildNamespace .Values.rhacs.namespace) }}
---
# Same placeholder in the learner build ns. Job rhacs-ci-token-mint copies the token here
# because cluster-resolved acs-image-check mounts secrets from the TaskRun namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pipelineHooks.secretName }}
  namespace: {{ .Values.pipelineHooks.buildNamespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.pipeline | quote }}
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  rox-api-endpoint: {{ $endpoint | quote }}
{{- end }}
{{- end }}
