{{- if and .Values.rhacs.enabled .Values.pipelineHooks.enabled .Values.pipelineHooks.ciTokenJob.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.ciToken | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.ciToken | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.ciToken | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
---
# UBI Job installs oc/python via dnf — needs anyuid (same pattern as Gitea seed).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.ciToken | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
{{- end }}
