{{- if and .Values.rhacs.enabled .Values.pipelineHooks.enabled }}
{{- $endpoint := include "rhacs.centralEndpoint" . }}
{{- $centralUrl := include "rhacs.centralUrl" . }}
---
# Quick reference for wiring RHACS + Lightwell pin gates into Pipelines.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhacs-pipeline-hooks-info
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.pipeline | quote }}
data:
  central_url: {{ $centralUrl | quote }}
  central_endpoint: {{ $endpoint | quote }}
  task_name: {{ .Values.pipelineHooks.taskName | quote }}
  dep_gate_task: {{ .Values.pipelineHooks.depGate.taskName | quote }}
{{- if .Values.pipelineHooks.pythonDepGate.enabled }}
  python_dep_gate_task: {{ .Values.pipelineHooks.pythonDepGate.taskName | quote }}
{{- end }}
  sbom_task: {{ .Values.pipelineHooks.sbom.taskName | quote }}
  pipeline_name: {{ .Values.pipelineHooks.pipeline.name | quote }}
{{- if .Values.pipelineHooks.pythonPipeline.enabled }}
  python_pipeline_name: {{ .Values.pipelineHooks.pythonPipeline.name | quote }}
{{- end }}
  task_namespace: {{ .Values.rhacs.namespace | quote }}
  secret_name: {{ .Values.pipelineHooks.secretName | quote }}
  secret_namespace_taskrun: {{ .Values.pipelineHooks.buildNamespace | quote }}
  registry_integration: {{ .Values.pipelineHooks.registryIntegration.name | quote }}
  example_pipeline_task: |
    - name: lightwell-dep-gate
      taskRef:
        name: {{ .Values.pipelineHooks.depGate.taskName }}
      params:
        - name: mode
          value: require-remediated
        - name: pom-path
          value: pom.xml
      workspaces:
        - name: source
          workspace: source
    - name: acs-policy-check
      runAfter: [lightwell-dep-gate]
      taskRef:
        name: {{ .Values.pipelineHooks.taskName }}
      params:
        - name: image
          value: $(params.image)
        - name: rox-secret-name
          value: {{ .Values.pipelineHooks.secretName }}
        - name: insecure-skip-tls-verify
          value: {{ .Values.pipelineHooks.insecureSkipTlsVerify | quote }}
        - name: fail-on-skipped
          value: {{ .Values.pipelineHooks.failOnSkipped | quote }}
{{- if .Values.pipelineHooks.pythonPipeline.enabled }}
  example_python_pipeline_task: |
    - name: lightwell-python-dep-gate
      taskRef:
        name: {{ .Values.pipelineHooks.pythonDepGate.taskName }}
      params:
        - name: mode
          value: require-remediated
        - name: requirements-path
          value: requirements.txt
      workspaces:
        - name: source
          workspace: source
    - name: acs-policy-check
      runAfter: [lightwell-python-dep-gate]
      taskRef:
        name: {{ .Values.pipelineHooks.taskName }}
      params:
        - name: image
          value: $(params.image)
        - name: rox-secret-name
          value: {{ .Values.pipelineHooks.secretName }}
        - name: insecure-skip-tls-verify
          value: {{ .Values.pipelineHooks.insecureSkipTlsVerify | quote }}
        - name: fail-on-skipped
          value: {{ .Values.pipelineHooks.failOnSkipped | quote }}
{{- end }}
  cli_example: |
    roxctl image check \
      --insecure-skip-tls-verify \
      -e {{ $endpoint }} \
      --image {{ .Values.pipelineHooks.exampleImage }}
  policy_note: >-
    Use Pipeline {{ .Values.pipelineHooks.pipeline.name }} for the Java fail/success lab
    (ConfigMap rhacs-lightwell-policy-lab). Prefer OSV-friendly Fixable Critical
    BUILD policies in Central plus .rhlw-* dep-gates for deterministic demos.
{{- end }}
