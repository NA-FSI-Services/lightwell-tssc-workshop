# Learner UX (Module 8 — Remediated, when channels.pypiRemediated.enabled):
#   Prefer ConfigMap:
#     oc -n lightwell-repo extract configmap/lightwell-pip-settings --keys=pip-remediated.conf --to=.
#   Or rewrite placeholders:
#     export LIGHTWELL_NEXUS_URL=https://nexus-lightwell-repo.apps.<domain>
#     export NEXUS_HOST="${LIGHTWELL_NEXUS_URL#https://}"
#     sed -i "s|NEXUS_BASE|${LIGHTWELL_NEXUS_URL}|g; s|NEXUS_HOST|${NEXUS_HOST}|g" pip-remediated.conf
#   Then:
#     PIP_CONFIG_FILE=$PWD/pip-remediated.conf pip install lw-workshop-pypi==1.0.0+rhlw.00001
#
# Canonical remote:
#   https://packages.redhat.com/lightwell/python/remediated/simple

[global]
index-url = NEXUS_BASE/repository/lightwell-python-remediated/simple
trusted-host = NEXUS_HOST
