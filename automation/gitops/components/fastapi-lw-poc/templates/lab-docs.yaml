{{- if and .Values.fastapiLwPoc.enabled .Values.labDocs.enabled }}
{{- $appUrl := include "fastapi-lw-poc.appUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-lw-poc-lab-docs
  namespace: {{ .Values.fastapiLwPoc.namespace }}
  labels:
    {{- include "fastapi-lw-poc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.fastapiLwPoc.syncWaves.config | quote }}
data:
  COMMANDS.md: |
    # fastapi-lw-poc — learner commands

    Sources: Gitea learner FastAPI remote (`requirements.txt` at clone root; seeded from
    `workshop-templates` in #147). Do not clone the GitHub monorepo for app work.

    ## Install (Validated stream — Module 7)

    ```bash
    # From Showroom terminal after cloning the learner Gitea FastAPI remote
    cd /tmp/fastapi-lw-poc
    export LIGHTWELL_NEXUS_URL=https://nexus-lightwell-repo.{{ .Values.deployer.domain | default "apps.cluster.example.com" }}
    # Prefer workshop ConfigMap (same URLs as app/pip.conf):
    #   oc -n lightwell-repo extract configmap/lightwell-pip-settings --keys=pip.conf --to=.
    # Or rewrite the placeholder in app/pip.conf, then:
    python3 -m venv .venv && source .venv/bin/activate
    PIP_CONFIG_FILE=$PWD/pip.conf pip install -r requirements.txt
    # Prove Validated index serves the LWN demo dep:
    PIP_CONFIG_FILE=$PWD/pip.conf pip install --force-reinstall --no-deps httpx==0.27.2
    uvicorn main:app --host 0.0.0.0 --port 8080
    ```

    Framework packages (FastAPI / uvicorn) resolve from public PyPI via
    `extra-index-url` in `pip.conf`. The LWN demo dependency is `httpx==0.27.2`
    from Lightwell Python Validated (seeded Nexus).

    ## Remediated marker (Module 8 — channels.pypiRemediated.enabled=true)

    ```bash
    oc -n lightwell-repo extract configmap/lightwell-pip-settings --keys=pip-remediated.conf --to=.
    PIP_CONFIG_FILE=$PWD/pip-remediated.conf pip install lw-workshop-pypi==1.0.0+rhlw.00001
    ```

    ## SBOM for RHTPA

    ```bash
    syft packages dir:. -o spdx-json > sbom.spdx.json
    # Or CycloneDX: syft packages dir:. -o cyclonedx-json > sbom.cdx.json
    ```

    ## HTTP / OpenAPI

    - Greeting: {{ $appUrl }}/api/greeting?name=Workshop
    - Health: {{ $appUrl }}/api/healthz
    - OpenAPI UI: {{ $appUrl }}/docs
    - OpenAPI JSON: {{ $appUrl }}/openapi.json

    Canonical LWN remotes (also via lightwell-repo Nexus):
    - https://packages.redhat.com/lightwell/python/validated
    - https://packages.redhat.com/lightwell/python/remediated
{{- end }}
