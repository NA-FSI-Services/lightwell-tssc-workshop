{{- if and .Values.fastapiLwPoc.enabled .Values.route.enabled }}
{{- $host := include "fastapi-lw-poc.routeHost" . }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.fastapiLwPoc.name }}
  namespace: {{ .Values.fastapiLwPoc.namespace }}
  labels:
    {{- include "fastapi-lw-poc.labels" . | nindent 4 }}
    app: {{ .Values.fastapiLwPoc.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.fastapiLwPoc.syncWaves.route | quote }}
spec:
  host: {{ $host | quote }}
  to:
    kind: Service
    name: {{ .Values.fastapiLwPoc.name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
