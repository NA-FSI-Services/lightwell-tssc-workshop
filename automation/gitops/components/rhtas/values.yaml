# Red Hat Trusted Artifact Signer — Lightwell TSSC workshop
# Patterns adapted from Trusted Software Factory / RHADS Securesign installs.
# Root App-of-Apps injects rhtas.* and deployer.* (see automation/bootstrap-infra).

rhtas:
  # Chart-level gate (root-app Application only exists when components.rhtas.enabled)
  enabled: true
  # Instance namespace (Securesign CR + supporting resources)
  namespace: trusted-artifact-signer
  # Securesign CR name
  name: trusted-artifact-signer
  apiVersion: rhtas.redhat.com/v1alpha1
  # Sync waves inside this chart (operator → instance → userinfo)
  syncWaves:
    namespace: "0"
    # alignJwks is wave 1 with the operator so Securesign (wave 2) starts
    # after OpenShift discovery advertises an in-cluster JWKS URI.
    alignJwksRbac: "0"
    operator: "1"
    alignJwks: "1"
    instance: "2"
    userinfo: "3"

# OLM install of the RHTAS Operator (AllNamespaces into openshift-operators)
operator:
  enabled: true
  # Subscription metadata.name
  name: rhtas-operator
  # OLM package name
  packageName: rhtas-operator
  namespace: openshift-operators
  # Prefer stable; pin stable-v1.3 when z-stream-only is required
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # openshift-operators already has an OperatorGroup — do not create another
  createOperatorGroup: false

# Securesign stack — Fulcio / Rekor / TUF / Trillian / CTlog (+ optional TSA)
securesign:
  fulcio:
    externalAccess: true
    organizationName: Lightwell TSSC Workshop
    organizationEmail: lightwell-tssc-workshop@demo.redhat.com
    # When empty, derived as fulcio.<deployer.domain>
    commonName: ""
    monitoring: false
    ctlog:
      port: 80
      prefix: trusted-artifact-signer
  rekor:
    externalAccess: true
    monitoring: false
    rekorSearchUI: true
    pvcSize: 5Gi
    backFillRedis:
      enabled: true
      schedule: "0 0 * * *"
  tuf:
    externalAccess: true
    port: 80
    pvcSize: 100Mi
    keys:
      - name: rekor.pub
      - name: ctfe.pub
      - name: fulcio_v1.crt.pem
  trillian:
    createDatabase: true
    pvcSize: 5Gi
    monitoring: false
    port: 8091
  ctlog:
    monitoring: false
    trillianPort: 8091
  # Timestamp Authority — optional; disabled by default for lighter workshops
  tsa:
    enabled: false
    externalAccess: false

# OIDC issuers for Fulcio (at least one required by CRD)
oidc:
  # Always include Kubernetes SA issuer for keyless Tekton/pipeline signing
  kubernetes:
    enabled: true
    clientID: trusted-artifact-signer
    issuer: "https://kubernetes.default.svc"
    issuerURL: "https://kubernetes.default.svc"
    # OpenShift publishes service-account-jwks-uri as the external API host.
    # Fulcio then refuses to fetch JWKS because that host is not
    # kubernetes.default.svc (issue 128). The Job below republishes the
    # in-cluster URI. Leave issuerURL on kubernetes.default.svc: the
    # pipeline, Conforma, and admission all expect that issuer string.
    alignJwksURI:
      enabled: true
      jobName: align-sa-jwks-uri
      serviceAccountName: align-sa-jwks-uri
      image: registry.redhat.io/openshift4/ose-cli:latest
      imagePullPolicy: IfNotPresent
      backoffLimit: 1
      activeDeadlineSeconds: 2400
      ttlSecondsAfterFinished: 86400
      waitSeconds: "1500"
      fulcioDeployment: fulcio-server
  # Optional Keycloak / RHBK issuer (RHADS-style). Disabled until SSO is provisioned.
  keycloak:
    enabled: false
    clientID: trusted-artifact-signer
    # When empty and enabled, derived as https://sso.<deployer.domain>/realms/<realm>
    issuerURL: ""
    realm: trusted-artifact-signer

# RHDP userinfo ConfigMap
userInfo:
  enabled: true
  title: "Lightwell TSSC Workshop — Trusted Artifact Signer"
  instructions: >-
    RHTAS provides keyless signing (Fulcio certificates, Rekor transparency log,
    TUF trust root). After the Securesign instance is Ready, use cosign with the
    Fulcio/Rekor/TUF URLs from `oc get securesign -n trusted-artifact-signer`.

# Injected by root-app / field content workload
deployer:
  domain: ""
  apiUrl: ""
