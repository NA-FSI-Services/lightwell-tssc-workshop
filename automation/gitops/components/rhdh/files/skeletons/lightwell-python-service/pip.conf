# Learner UX (Module 7 — Validated):
#   Prefer ConfigMap (host + URLs already correct):
#     oc -n lightwell-repo extract configmap/lightwell-pip-settings --keys=pip.conf --to=.
#   Or rewrite placeholders in this file:
#     export LIGHTWELL_NEXUS_URL=https://nexus-lightwell-repo.apps.<domain>
#     export NEXUS_HOST="${LIGHTWELL_NEXUS_URL#https://}"
#     sed -i "s|NEXUS_BASE|${LIGHTWELL_NEXUS_URL}|g; s|NEXUS_HOST|${NEXUS_HOST}|g" pip.conf
#   Then:
#     PIP_CONFIG_FILE=$PWD/pip.conf pip install -r requirements.txt
#
# index-url  → Lightwell Python Validated (seeded Nexus hosts httpx==0.27.2)
# extra-index-url → public PyPI fallback for FastAPI / uvicorn (mirror of Maven Central
#   in spring-boot-lw-poc settings.xml). Prefer Nexus when the package exists there.
#
# Canonical remote (document even when seeded):
#   https://packages.redhat.com/lightwell/python/validated/simple
#
# Never commit LW_USERNAME / LW_PASSWORD.

[global]
index-url = NEXUS_BASE/repository/lightwell-python-validated/simple
extra-index-url = https://pypi.org/simple
trusted-host = NEXUS_HOST
