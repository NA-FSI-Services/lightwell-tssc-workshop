# Optional RHDH path — prefer Gitea student remotes (demo-userinfo-gitea → student_repo_url).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ${{ values.name }}-build-sign-
  labels:
    app.kubernetes.io/part-of: lightwell-tssc-workshop
spec:
  pipelineRef:
    name: ${{ values.name }}-build-sign
  params:
    - name: repo-url
      value: STUDENT_REPO_URL_PLACEHOLDER
    - name: revision
      value: main
    - name: image-url
      value: image-registry.openshift-image-registry.svc:5000/<lab-namespace>/${{ values.name }}:latest
    - name: buildconfig-name
      value: ${{ values.name }}
    - name: cosign-fulcio-url
      value: http://fulcio-server.trusted-artifact-signer.svc
    - name: cosign-rekor-url
      value: http://rekor-server.trusted-artifact-signer.svc
    - name: cosign-tuf-url
      value: http://tuf.trusted-artifact-signer.svc
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    - name: sbom
      emptyDir: {}
  taskRunTemplate:
    serviceAccountName: pipeline
    # Optional local Maven Secret lightwell-maven (LW_*) — does not drive BuildConfig image build.
    # Link rh-registry-pull (or cluster pull secret) to pipeline SA for cosign-rhel9.
