{{- if and .Values.rhdh.enabled .Values.operator.enabled .Values.operator.createOperatorGroup }}
---
# Dedicated OperatorGroup for the RHDH Operator (AllNamespaces watch).
# See: Installing RHDH on OpenShift with the Operator.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.operator.name }}-operator-group
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhdh.syncWaves.operator | quote }}
spec: {}
{{- end }}
