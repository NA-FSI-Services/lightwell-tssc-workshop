{{- if and .Values.lightwellRepo.enabled .Values.seed.enabled .Values.seed.createAdminSecretPlaceholder }}
---
# Optional Nexus admin credentials. Leave empty to let the seed Job oc-exec
# /nexus-data/admin.password from the Nexus pod. Populate to skip exec capture:
#   oc -n lightwell-repo create secret generic nexus-admin-credentials \
#     --from-literal=username=admin --from-literal=password='...' \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.seed.adminSecretName }}
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.secrets | quote }}
type: Opaque
stringData:
  username: {{ .Values.seed.adminUsername | quote }}
  password: {{ .Values.seed.adminPassword | quote }}
{{- end }}
