{{- if and .Values.lightwellRepo.enabled .Values.credentials.createPlaceholder }}
---
# Lightwell Network registry service account credentials.
# Populate via RHDP secret injection — never commit real LW_USERNAME / LW_PASSWORD.
# Used when lightwellRepo.mode=proxy to authenticate to packages.redhat.com.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.secrets | quote }}
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  LW_USERNAME: {{ .Values.credentials.username | quote }}
  LW_PASSWORD: {{ .Values.credentials.password | quote }}
  # Convenience aliases for Nexus remote-repo basic auth fields
  username: {{ .Values.credentials.username | quote }}
  password: {{ .Values.credentials.password | quote }}
{{- end }}
