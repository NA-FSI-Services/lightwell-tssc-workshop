{{- if and .Values.lightwellRepo.enabled .Values.seed.enabled }}
---
# Creates channel repos and (seeded mode) uploads Validated / Remediated / OSV / SBOM content.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.seed.jobName }}
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.seed | quote }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.seed.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "lightwell-repo.labels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.seed.serviceAccountName }}
      containers:
        - name: seed
          image: {{ .Values.seed.image | quote }}
          imagePullPolicy: {{ .Values.seed.imagePullPolicy | quote }}
          command: ["/bin/bash", "/seed/seed-repos.sh"]
          env:
            - name: NAMESPACE
              value: {{ .Values.lightwellRepo.namespace | quote }}
            - name: NEXUS_SVC
              value: {{ printf "http://%s:%v" .Values.nexus.name .Values.nexus.service.port | quote }}
            - name: LIGHTWELL_REPO_MODE
              value: {{ .Values.lightwellRepo.mode | quote }}
            - name: SEED_DIR
              value: /seed
            - name: OSV_ID
              value: {{ .Values.sampleOsv.vulnerabilityId | quote }}
            - name: VALIDATED_REPO
              value: {{ .Values.channels.validated.name | quote }}
            - name: REMEDIATED_REPO
              value: {{ .Values.channels.remediated.name | quote }}
            - name: OSV_REPO
              value: {{ .Values.channels.osv.name | quote }}
            - name: VALIDATED_HOSTED
              value: {{ .Values.channels.validated.hostedName | quote }}
            - name: REMEDIATED_HOSTED
              value: {{ .Values.channels.remediated.hostedName | quote }}
            - name: OSV_HOSTED
              value: {{ .Values.channels.osv.hostedName | quote }}
            - name: VALIDATED_REMOTE
              value: {{ .Values.channels.validated.remoteUrl | quote }}
            - name: REMEDIATED_REMOTE
              value: {{ .Values.channels.remediated.remoteUrl | quote }}
            - name: OSV_REMOTE
              value: {{ .Values.channels.osv.remoteUrl | quote }}
            - name: PYPI_VALIDATED_ENABLED
              value: {{ .Values.channels.pypiValidated.enabled | quote }}
            - name: PYPI_REMEDIATED_ENABLED
              value: {{ .Values.channels.pypiRemediated.enabled | quote }}
            - name: PYPI_VALIDATED_REPO
              value: {{ .Values.channels.pypiValidated.name | quote }}
            - name: PYPI_REMEDIATED_REPO
              value: {{ .Values.channels.pypiRemediated.name | quote }}
            - name: PYPI_VALIDATED_HOSTED
              value: {{ .Values.channels.pypiValidated.hostedName | quote }}
            - name: PYPI_REMEDIATED_HOSTED
              value: {{ .Values.channels.pypiRemediated.hostedName | quote }}
            - name: PYPI_VALIDATED_REMOTE
              value: {{ .Values.channels.pypiValidated.remoteUrl | quote }}
            - name: PYPI_REMEDIATED_REMOTE
              value: {{ .Values.channels.pypiRemediated.remoteUrl | quote }}
            - name: PYPI_SEED_PACKAGE
              value: {{ .Values.pypiSeed.package | quote }}
            - name: PYPI_SEED_VERSION
              value: {{ .Values.pypiSeed.version | quote }}
            - name: PYPI_SEED_WHEEL_URL
              value: {{ .Values.pypiSeed.wheelUrl | quote }}
            - name: PYPI_REMEDIATED_PACKAGE
              value: {{ .Values.pypiSeed.remediatedPackage | quote }}
            - name: PYPI_REMEDIATED_VERSION
              value: {{ .Values.pypiSeed.remediatedVersion | quote }}
            - name: DOCKER_MIRROR_ENABLED
              value: {{ .Values.channels.dockerMirror.enabled | quote }}
            - name: DOCKER_MIRROR_REPO
              value: {{ .Values.channels.dockerMirror.name | quote }}
            - name: DOCKER_HTTP_PORT
              value: {{ .Values.channels.dockerMirror.httpPort | quote }}
            - name: REGISTRY_HOST
              value: {{ include "lightwell-repo.registryHost" . | quote }}
            - name: DOCKER_SECRET_NAME
              value: {{ .Values.ocMirror.dockerSecretName | quote }}
            - name: NEXUS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seed.adminSecretName }}
                  key: username
                  optional: true
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seed.adminSecretName }}
                  key: password
                  optional: true
            - name: LW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: LW_USERNAME
                  optional: true
            - name: LW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: LW_PASSWORD
                  optional: true
          volumeMounts:
            - name: seed
              mountPath: /seed
          resources:
            requests:
              cpu: {{ .Values.seed.resources.requests.cpu | quote }}
              memory: {{ .Values.seed.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.seed.resources.limits.cpu | quote }}
              memory: {{ .Values.seed.resources.limits.memory | quote }}
      volumes:
        - name: seed
          configMap:
            name: {{ .Values.seed.configMapName }}
            defaultMode: 0755
{{- end }}
