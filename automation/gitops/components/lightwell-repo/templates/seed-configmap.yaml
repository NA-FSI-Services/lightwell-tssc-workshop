{{- if and .Values.lightwellRepo.enabled .Values.seed.enabled }}
---
# Seed payloads for deterministic RHDP labs (resolution stubs + compile-capable commons-lang3, OSV, CycloneDX).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.seed.configMapName }}
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.config | quote }}
data:
  seed-repos.sh: |
{{ .Files.Get "files/seed/seed-repos.sh" | indent 4 }}
  spring-core-5.3.18.pom: |
{{ .Files.Get "files/seed/spring-core-5.3.18.pom" | indent 4 }}
  spring-core-5.3.18.rhlw-00003.pom: |
{{ .Files.Get "files/seed/spring-core-5.3.18.rhlw-00003.pom" | indent 4 }}
  commons-lang3-3.14.0.pom: |
{{ .Files.Get "files/seed/commons-lang3-3.14.0.pom" | indent 4 }}
  commons-lang3-3.14.0.rhlw-00001.pom: |
{{ .Files.Get "files/seed/commons-lang3-3.14.0.rhlw-00001.pom" | indent 4 }}
  spring-core-5.3.18.cdx.json: |
{{ .Files.Get "files/seed/spring-core-5.3.18.cdx.json" | indent 4 }}
  spring-core-5.3.18.rhlw-00003.cdx.json: |
{{ .Files.Get "files/seed/spring-core-5.3.18.rhlw-00003.cdx.json" | indent 4 }}
  commons-lang3-3.14.0.cdx.json: |
{{ .Files.Get "files/seed/commons-lang3-3.14.0.cdx.json" | indent 4 }}
  commons-lang3-3.14.0.rhlw-00001.cdx.json: |
{{ .Files.Get "files/seed/commons-lang3-3.14.0.rhlw-00001.cdx.json" | indent 4 }}
  commons-lang3-3.14.0.rhlw-00001.vex.json: |
{{ .Files.Get "files/seed/commons-lang3-3.14.0.rhlw-00001.vex.json" | indent 4 }}
  {{ .Values.sampleOsv.vulnerabilityId }}.json: |
{{ .Files.Get "files/seed/LW-DEMO-0001.json" | indent 4 }}
  {{ .Values.sampleVex.vulnerabilityId }}.json: |
{{ .Files.Get "files/seed/LW-DEMO-0002.json" | indent 4 }}
  workshop-stub.jar.b64: |
{{ .Files.Get "files/seed/workshop-stub.jar.b64" | indent 4 }}
  lw_workshop_pypi-remediated.whl.b64: |
{{ .Files.Get "files/seed/lw_workshop_pypi-remediated.whl.b64" | indent 4 }}
  README: |
    Seeded-mirror mode (lightwellRepo.mode=seeded) uploads these files into Nexus hosted repos.

    Resolution stubs (manifest-only JAR — Module 2/3 dependency:get):
      org.springframework:spring-core:5.3.18
      org.springframework:spring-core:5.3.18.rhlw-00003

    Compile-capable (real Apache Commons Lang 3.14.0 JAR fetched at seed time):
      org.apache.commons:commons-lang3:3.14.0
      org.apache.commons:commons-lang3:3.14.0.rhlw-00001

    OSV path shape (raw repo):
      osv/java/remediated/{{ .Values.sampleOsv.vulnerabilityId }}.json

    CycloneDX (raw repo):
      sbom/java/validated/.../5.3.18.cdx.json
      sbom/java/remediated/.../5.3.18.rhlw-00003.cdx.json
      sbom/java/validated/org.apache.commons/commons-lang3/3.14.0.cdx.json
      sbom/java/remediated/org.apache.commons/commons-lang3/3.14.0.rhlw-00001.cdx.json

    Track 7 scored VEX (Q12 C+ — GAV-bound, not live CSAF):
      Maven classifier beside {{ .Values.sampleVex.packageName }}:{{ .Values.sampleVex.remediatedVersion }}
        {{ .Values.sampleVex.mavenCdxClassifier }} / {{ .Values.sampleVex.mavenVexClassifier }}
      Raw OSV:
        {{ .Values.sampleVex.rawCdxPath }}
        {{ .Values.sampleVex.rawVexPath }}
        osv/java/remediated/{{ .Values.sampleVex.vulnerabilityId }}.json
      Learner pulls from Nexus and ingests to TPA. Do not pre-ingest. Do not enable redhat-csaf as the Check.
      Python SPDX/VEX analogue is Track 8 text only (no second GAV seed).

    PyPI Validated (wheel fetched at seed time when channels.pypiValidated.enabled):
      {{ .Values.pypiSeed.package }}=={{ .Values.pypiSeed.version }}
      repo: {{ .Values.channels.pypiValidated.name }}

    PyPI Remediated (required — channels.pypiRemediated.enabled={{ .Values.channels.pypiRemediated.enabled }}):
      {{ .Values.pypiSeed.remediatedPackage }}=={{ .Values.pypiSeed.remediatedVersion }}
      repo: {{ .Values.channels.pypiRemediated.name }}

    Live proxy mode uses packages.redhat.com remotes with LW_USERNAME / LW_PASSWORD instead.
    Keep channels.pypiRemediated.enabled=true for this Java+Python workshop (seeded marker).

    V2-10 Docker dest {{ .Values.channels.dockerMirror.name }} is created EMPTY.
    Do not upload HUMMINGBIRD_JAVA_RUNTIME at seed time.
{{- end }}
