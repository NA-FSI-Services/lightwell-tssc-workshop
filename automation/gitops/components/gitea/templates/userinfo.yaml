{{- if and .Values.gitea.enabled .Values.userInfo.enabled }}
{{- $url := include "gitea.url" . }}
{{- $templatesOrg := include "gitea.templatesOrgName" . }}
{{- $primaryUser := .Values.student.username | default "student" }}
{{- $learnerOrg := include "gitea.learnerOrgName" $primaryUser }}
{{- $repoName := .Values.seed.repoName }}
{{- $repoUrl := include "gitea.studentAppRepoUrl" (list . $primaryUser) }}
{{- $gitopsName := .Values.seed.gitops.repoName | default "gitops-spring-boot-lw-poc" }}
{{- $gitopsUrl := include "gitea.studentGitopsRepoUrl" (list . $primaryUser) }}
{{- $gitopsProdName := .Values.seed.gitops.prod.repoName | default "gitops-prod-spring-boot-lw-poc" }}
{{- $gitopsProdUrl := include "gitea.studentProdGitopsRepoUrl" (list . $primaryUser) }}
{{- $promoteNs := .Values.gitopsAppSet.namespace | default (printf "%s-%s" (.Values.gitopsAppSet.namespacePrefix | default "lw-poc") $primaryUser) }}
{{- $stageApp := .Values.gitopsAppSet.appName | default (printf "%s-%s" (.Values.gitopsAppSet.appNamePrefix | default "lw-poc") $primaryUser) }}
{{- $buildNs := .Values.gitopsAppSet.buildNamespace | default "lw-poc-build" }}
{{- $prodNs := .Values.gitopsAppSetProd.namespace | default "lw-poc-prod" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-userinfo-gitea
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.userinfo | quote }}
data:
  demo_title: {{ .Values.userInfo.title | quote }}
  access_instructions: {{ .Values.userInfo.instructions | quote }}
  deployment_type: "helm"
  gitea_url: {{ $url | quote }}
  # Expected org/repos after Module 2 learner setup (not auto-created).
  student_gitea_org: {{ $learnerOrg | quote }}
  student_username: {{ $primaryUser | quote }}
  student_password: {{ .Values.student.password | quote }}
  student_repo_url: {{ $repoUrl | quote }}
  student_repo_name: {{ $repoName | quote }}
  student_repo_revision: {{ .Values.seed.defaultBranch | quote }}
  student_pom_path: "pom.xml"
  student_gitops_repo_url: {{ $gitopsUrl | quote }}
  student_gitops_repo_name: {{ $gitopsName | quote }}
  student_trust_policy_path: "admission/trust-policy.yaml"
  student_promote_namespace: {{ $promoteNs | quote }}
  student_argocd_app: {{ $stageApp | quote }}
  student_build_namespace: {{ $buildNs | quote }}
  renovate_bot_username: "renovate-bot"
{{- if .Values.seed.gitops.prod.enabled }}
  student_prod_gitops_repo_url: {{ $gitopsProdUrl | quote }}
  student_prod_gitops_repo_name: {{ $gitopsProdName | quote }}
  student_prod_namespace: {{ $prodNs | quote }}
  student_prod_argocd_app: {{ .Values.gitopsAppSetProd.appName | default "lw-poc-prod" | quote }}
{{- end }}
{{- if .Values.seed.python.enabled }}
  student_python_repo_url: {{ include "gitea.studentPythonAppRepoUrl" (list . $primaryUser) | quote }}
  student_python_repo_name: {{ .Values.seed.python.repoName | default "fastapi-lw-poc" | quote }}
  student_python_requirements_path: "requirements.txt"
  student_python_gitops_repo_url: {{ include "gitea.studentPythonGitopsRepoUrl" (list . $primaryUser) | quote }}
  student_python_gitops_repo_name: {{ .Values.seed.python.gitops.repoName | default "gitops-fastapi-lw-poc" | quote }}
{{- end }}
{{- if .Values.gitopsAppSetPython.enabled }}
  student_python_promote_namespace: {{ printf "%s-%s" (.Values.gitopsAppSetPython.namespacePrefix | default "lw-fastapi") $primaryUser | quote }}
  student_python_argocd_app: {{ printf "%s-%s" (.Values.gitopsAppSetPython.appNamePrefix | default "lw-fastapi") $primaryUser | quote }}
{{- end }}
  # Operator-prepared templates (monorepo isolation) — source for learner-seed-from-templates.sh
  template_gitea_org: {{ $templatesOrg | quote }}
  template_app_repo_url: {{ include "gitea.templateAppRepoUrl" . | quote }}
  template_gitops_repo_url: {{ include "gitea.templateGitopsRepoUrl" . | quote }}
{{- if .Values.seed.gitops.prod.enabled }}
  template_prod_gitops_repo_url: {{ include "gitea.templateProdGitopsRepoUrl" . | quote }}
{{- end }}
{{- if .Values.seed.python.enabled }}
  template_python_app_repo_url: {{ include "gitea.templatePythonAppRepoUrl" . | quote }}
  template_python_gitops_repo_url: {{ include "gitea.templatePythonGitopsRepoUrl" . | quote }}
{{- end }}
{{- if .Values.seed.templates.skeleton.enabled }}
  template_skeleton_repo_url: {{ include "gitea.templateSkeletonRepoUrl" . | quote }}
{{- end }}
{{- if .Values.seed.templates.skeletonPython.enabled }}
  template_python_skeleton_repo_url: {{ include "gitea.templatePythonSkeletonRepoUrl" . | quote }}
{{- end }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- end }}
