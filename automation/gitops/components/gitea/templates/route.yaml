{{- if .Values.gitea.enabled }}
{{- $host := include "gitea.routeHost" . }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.gitea.routeHostPrefix }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app: {{ .Values.gitea.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.route | quote }}
spec:
  host: {{ $host | quote }}
  to:
    kind: Service
    name: {{ .Values.gitea.name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
