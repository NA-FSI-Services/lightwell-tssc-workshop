{{- if .Values.gitea.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gitea.name }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app: {{ .Values.gitea.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitea.syncWaves.deploy | quote }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.gitea.name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
