name: Antora validate

on:
  # No path filters on pull_request: ruleset main-protect requires check
  # "structure and generate". Skipped workflows never report that check → BLOCKED.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site.yml"
      - "site-ci.yml"
      - "scripts/asciidoc-check.sh"
      - "scripts/showroom-check.sh"
      - "scripts/learner-git-check.sh"
      - "charts/components/gitea/files/seed/**"
      - "charts/components/rhdh/files/**"
      - "charts/components/showroom/**"
      - "charts/root-app/values.yaml"
      - "charts/root-app/templates/applications.yaml"
      - "docs/SHOWROOM-UPDATE-SPEC.md"
      - "agnosticv/**"
      - ".github/workflows/antora-validate.yml"

concurrency:
  group: antora-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  antora:
    name: structure and generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Structural AsciiDoc / Antora checks
        run: ./scripts/asciidoc-check.sh

      - name: Learner Git decision (#120)
        run: ./scripts/learner-git-check.sh

      - name: Showroom ↔ content contract
        run: ./scripts/showroom-check.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate site (lightweight playbook)
        run: npx --yes antora@3.1.10 site-ci.yml

      - name: Verify Modules 1–6 and start page were generated
        run: |
          set -euo pipefail
          required=(
            www/modules/index.html
            www/modules/module-01-overview.html
            www/modules/module-02-maven.html
            www/modules/module-03-scaffold.html
            www/modules/module-04-osv.html
            www/modules/module-05-sbom.html
            www/modules/module-06-pipeline.html
            www/modules/rhda-shift-left.html
            www/modules/appendix-osv-manifest-polling.html
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: missing Antora output $f" >&2
              missing=1
            else
              echo "OK $f"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Generated HTML under www:" >&2
            find www -name '*.html' | sort >&2 || true
            exit 1
          fi
          echo "Antora module pages OK"
          find www -name '*.html' | sort | head -40
