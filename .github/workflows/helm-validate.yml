name: Helm validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: helm-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: lint and template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint and template (charts/)
        run: ./scripts/helm-validate.sh
