{{- if .Values.application.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.applicationName }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: lightwell-dev-bootstrap
    app.kubernetes.io/component: root-app
    demo.redhat.com/application: "lightwell-tssc-workshop"
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl | quote }}
    targetRevision: {{ .Values.gitops.revision | quote }}
    path: {{ .Values.gitops.path | quote }}
    helm:
      valuesObject:
        deployer:
          domain: {{ required "deployer.domain is required" .Values.deployer.domain | quote }}
          apiUrl: {{ required "deployer.apiUrl is required" .Values.deployer.apiUrl | quote }}
        components:
          # Module 1 ConfigMap exercises require lightwellRepo (wave 20)
          lightwellRepo:
            enabled: {{ .Values.lightwellRepo.enabled }}
          # Module 5 student Git — single workshop user from bootstrap (see DEV-CLUSTER-WORKSHOP-USER.md)
          gitea:
            enabled: {{ .Values.gitea.enabled }}
            studentUsername: {{ .Values.gitea.studentUsername | quote }}
{{- if .Values.gitea.students }}
            students:
{{- toYaml .Values.gitea.students | nindent 14 }}
{{- end }}
          showroom:
            enabled: {{ .Values.showroom.enabled }}
            content:
              antoraPlaybook: {{ .Values.showroom.antoraPlaybook | quote }}
              repoRef: {{ .Values.showroom.repoRef | quote }}
            terminal:
              labClusterAccess: {{ .Values.showroom.labClusterAccess }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.namespace }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
