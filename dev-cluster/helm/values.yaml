# Values for ephemeral claim bootstrap. Prefer passing from claim.env via
# scripts/dev-cluster-bootstrap.sh rather than committing claim-specific values.

gitopsOperator:
  enabled: true
  namespace: openshift-gitops-operator
  channel: latest
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: ""

application:
  # Set true after GitOps CRDs exist (bootstrap script does this in phase 2)
  enabled: true

argocd:
  namespace: openshift-gitops
  project: default
  applicationName: lightwell-tssc-root
  # Required so App-of-Apps can create namespaces / SCC bindings / ClusterRoleBindings
  grantClusterAdmin: true

gitops:
  repoUrl: "https://github.com/NA-FSI-Services/lightwell-tssc-workshop.git"
  revision: "main"
  path: "charts/root-app"

deployer:
  domain: ""
  apiUrl: ""

# Module 1 QA path: Showroom + seeded Lightwell channel/OSV ConfigMaps
lightwellRepo:
  enabled: true

showroom:
  enabled: true
  antoraPlaybook: "site-ci.yml"
  repoRef: "main"
  labClusterAccess: true
